# Codex 项目级配置（MCP 服务器）
# 正版 Codex（OpenAI 模型）工具面放开，配全套 MCP。
# 注意：Windows 上 stdio 命令需用 cmd /c 包装，否则 npx 无法直接 spawn。

model_verbosity = "medium"
[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@0.0.79"]

[mcp_servers.chrome-devtools]
command = "cmd"
args = ["/c", "npx", "-y", "chrome-devtools-mcp@1.8.0"]

[mcp_servers.context7]
command = "cmd"
args = ["/c", "npx", "-y", "@upstash/context7-mcp@4.0.4"]
