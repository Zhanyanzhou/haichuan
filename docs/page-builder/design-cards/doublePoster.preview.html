<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双图文 · 构图三案 v4（依 VCA/HW 一手实测）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FFFFFF;            /* VCA/Cartier/HW 实测纯白 */
    --ink: #1A1A1A;
    --text: #383838;          /* HW 实测正文色 */
    --muted: #9B9B9B;         /* 冷灰 */
    --gold: #B8944E;          /* 唯一点缀：CTA 细线 */
    --studio: #F2F2F2;
    --serif: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }
  body { background: #111; font-family: var(--sans); padding: 40px 0 100px; }

  .plan-label { max-width: 1520px; margin: 56px auto 18px; padding: 0 72px;
    display: flex; align-items: baseline; gap: 18px; }
  .plan-label .tag { font-family: var(--serif); font-weight: 300;
    font-size: 34px; color: #FFF; }
  .plan-label .desc { font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); text-transform: uppercase; }

  .dp { max-width: 1520px; margin: 0 auto; background: var(--bg); }

  .ph { position: relative; background: var(--studio);
    background-image: radial-gradient(ellipse 62% 52% at 50% 44%, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%); }
  .ph .spec { position: absolute; right: 16px; bottom: 12px; font-size: 9px;
    letter-spacing: 0.22em; color: #ADADAD; text-transform: uppercase; }

  /* —— 排印：小字宽距，VCA 式签名语言 —— */
  .kicker { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); }                     /* N°02 并入眉题，无巨字 */
  .title { font-family: var(--serif); font-weight: 400;
    font-size: 32px; line-height: 1.4; letter-spacing: -0.2px;  /* HW 实测字距 */
    color: var(--ink); }
  .body { font-size: 14px; line-height: 2.0; color: var(--text); }
  .cta { display: inline-block; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink);
    padding-bottom: 7px; border-bottom: 1px solid var(--ink);  /* Hermès/VCA 实测：黑色细底线，非金色 */
    text-decoration: none; }

  /* ═══ A · 全宽大片 + 下注解带 ═══ */
  .ka { padding: 0 72px 170px; }
  .ka__main { aspect-ratio: 3 / 2; }
  .ka__band { display: grid; grid-template-columns: repeat(12, minmax(0,1fr));
    gap: 24px; margin-top: 128px; }
  .ka__copy { grid-column: 1 / span 5; }
  .ka__copy .title { margin-top: 26px; }
  .ka__copy .body { margin-top: 26px; }
  .ka__copy .cta { margin-top: 56px; }
  .ka__detail { grid-column: 9 / span 4; aspect-ratio: 4 / 5; align-self: start; }

  /* ═══ B · 竖幅主图通高 + 右列顶底对齐 ═══ */
  .kb { padding: 170px 72px 170px; }
  .kb__grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 24px; }
  .kb__main { grid-column: 1 / span 8; grid-row: 1 / span 2; aspect-ratio: 4 / 5; }
  .kb__copy { grid-column: 9 / span 4; }
  .kb__copy .title { font-size: 30px; margin-top: 24px; }
  .kb__copy .body { margin-top: 24px; }
  .kb__copy .cta { margin-top: 48px; }
  .kb__detail { grid-column: 9 / span 4; align-self: end; aspect-ratio: 4 / 5; margin-top: 64px; }

  /* ═══ C · 章节头 + 图对 ═══ */
  .kc { padding: 170px 72px 0; }
  .kc__head { margin-bottom: 110px; }
  .kc__head .title { font-size: 40px; margin-top: 26px; }
  .kc__row { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 24px; }
  .kc__main { grid-column: 1 / span 7; aspect-ratio: 4 / 5; }
  .kc__side { grid-column: 9 / span 4; display: flex; flex-direction: column; }
  .kc__detail { aspect-ratio: 3 / 4; }
  .kc__side .body { margin-top: 36px; }
  .kc__side .cta { margin-top: 46px; }
  .kc__end { height: 170px; }
</style>
</head>
<body>

  <div class="plan-label"><span class="tag">Plan A</span><span class="desc">全宽大片 · 下注解带</span></div>
  <section class="dp ka">
    <figure class="ph ka__main"><figcaption class="spec">Main · 3:2 · Full Width</figcaption></figure>
    <div class="ka__band">
      <div class="ka__copy">
        <div class="kicker">N°02 — The Craft</div>
        <h2 class="title">一件作品的两次诞生</h2>
        <p class="body">先由匠人之手赋形，<br>再交由时间检验光泽。</p>
        <a class="cta" href="#">Discover</a>
      </div>
      <figure class="ph ka__detail"><figcaption class="spec">Detail · 4:5</figcaption></figure>
    </div>
  </section>

  <div class="plan-label"><span class="tag">Plan B</span><span class="desc">竖幅主图通高 · 右列顶底对齐</span></div>
  <section class="dp kb">
    <div class="kb__grid">
      <figure class="ph kb__main"><figcaption class="spec">Main · 4:5 · Tall</figcaption></figure>
      <div class="kb__copy">
        <div class="kicker">N°02 — The Craft</div>
        <h2 class="title">一件作品的<br>两次诞生</h2>
        <p class="body">先由匠人之手赋形，<br>再交由时间检验光泽。</p>
        <a class="cta" href="#">Discover</a>
      </div>
      <figure class="ph kb__detail"><figcaption class="spec">Detail · 4:5</figcaption></figure>
    </div>
  </section>

  <div class="plan-label"><span class="tag">Plan C</span><span class="desc">章节头 · 图对</span></div>
  <section class="dp kc">
    <div class="kc__head">
      <div class="kicker">N°02 — The Craft</div>
      <h2 class="title">一件作品的两次诞生</h2>
    </div>
    <div class="kc__row">
      <figure class="ph kc__main"><figcaption class="spec">Main · 4:5</figcaption></figure>
      <div class="kc__side">
        <figure class="ph kc__detail"><figcaption class="spec">Detail · 3:4</figcaption></figure>
        <p class="body">先由匠人之手赋形，再交由时间检验光泽。</p>
        <a class="cta" href="#">Discover</a>
      </div>
      <div class="kc__end" style="grid-column: 1 / span 12;"></div>
    </div>
  </section>

</body>
</html>
