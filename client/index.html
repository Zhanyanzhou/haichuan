<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261027b" />
    <link rel="apple-touch-icon" href="/loading-mark.png?v=20261027b" />
    <link rel="stylesheet" href="/route-loading.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SPA fallback 永远不参与索引；严格发布预渲染会用已核验的逐路由标签替换。 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="海川珠宝公开网站。可提交选款、定制或旧款相关咨询需求，具体服务与安排以实际沟通为准。"
    />
    <meta
      name="keywords"
      content="珠宝,首饰,黄金,钻石,手镯,吊坠,戒指,耳饰,海川珠宝"
    />
    <title>海川珠宝官方网站</title>
    <!-- Open Graph -->
    <meta property="og:title" content="海川珠宝官方网站" />
    <meta
      property="og:description"
      content="海川珠宝公开网站。具体作品、服务与安排以当前公开页面和实际沟通为准。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <!-- og:image / twitter:image 待运营提供真实分享图后补回；当前不引用不存在的资源 -->
    <!-- Organization JSON-LD 由运行时按公开 SiteSettings 生成，避免静态壳输出过期业务事实。 -->
    <!-- 品牌字体已本地自托管（Fontsource，经 src/main.tsx 引入），无外部字体请求。 -->
  </head>
  <body class="bg-scifi-bg text-scifi-text">
    <div id="root">
      <div class="site-route-loading" role="status" aria-live="polite">
        <span class="site-route-loading__indicator" aria-hidden="true">
          <span class="site-route-loading__ring"></span>
          <img class="site-route-loading__mark" src="/favicon.svg?v=20261027c" alt="" width="32" height="32" />
        </span>
        <span class="site-route-loading__text">页面加载中</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
