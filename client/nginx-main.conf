worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 访问日志只保留 method + path，不记录查询串或 Referer。
  # 密码重置 token、OAuth code/state 等临时凭证因此不会进入 stdout 日志。
  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "-" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  # 文本类响应启用 gzip：本文件替换了官方镜像默认主配置，压缩需显式开启。
  # 图片/视频/woff2 本身已是压缩格式不列入；text/html 由 gzip 默认始终压缩。
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
