map $request_uri $hc_robots_tag {
  default "";
  ~*^/en(/|$) "noindex, nofollow";
  ~*^/(admin|preview|customer|cart|checkout|partner)(/|$) "noindex, nofollow";
}

map $uri $hc_referrer_policy {
  default "strict-origin-when-cross-origin";
  ~^/customer/reset$ "no-referrer";
  ~^/api/customers/wechat/callback$ "no-referrer";
}

map $uri $hc_content_security_policy {
  default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://rsms.me; font-src 'self' data: https://rsms.me";
  # OAuth 回调的 frame-ancestors 必须绑定服务端已验证的 parentOrigin。
  # 空值让 Nginx 不追加第二条 CSP，避免与服务端策略取交集后错误阻止合法父页面。
  ~^/api/customers/wechat/callback$ "";
}

# 公网 HTTP 入口：永不信任来访者提供的转发头，只允许 ACME 挑战，其余统一升级 HTTPS。
server {
  listen 8080;
  server_name _;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

# 可信 TLS 边缘回源入口：只能通过宿主回环映射或受控容器网络访问。
# 边缘代理必须在转发前覆盖 X-Real-IP；所有来访者自带的 Forwarded/X-Forwarded-* 在此统一丢弃或覆盖。
server {
  listen 8081;
  server_name _;

  # 8081 只经宿主回环映射或受控容器网络开放，因此此入口信任边缘代理覆盖的
  # 单值 X-Real-IP。由 Nginx realip 模块负责 IPv4/IPv6 解析；缺失或非法值
  # 不会替换 $remote_addr，安全退化为直接边缘代理地址。
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Real-IP;
  real_ip_recursive off;

  # 前端静态资源与 API 统一的基础安全响应头。
  # 受控图片由 SecureImage 以 Blob URL 渲染；仅放开 img-src 的 blob:，其余资源仍保持最小权限。
  # 字体已本地自托管（Fontsource，构建产物 /assets/*.woff2）；仅保留 Puck 编辑器样式的
  # rsms.me（其 @import "inter.css" 及 woff2 同域——被 CSP 拦截时整个样式表会在浏览器
  # CSS 层标记失败，编辑器页面直接崩溃到兜底页，故必须放行）。
  add_header Content-Security-Policy $hc_content_security_policy always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy $hc_referrer_policy always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # 由 server 级 map 统一派生，避免 location 内 add_header 覆盖并丢失上述安全响应头。
  add_header X-Robots-Tag $hc_robots_tag always;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # 上传体限制：图片 10MB / 视频 100MB（upload.controller 白名单上限），nginx 默认 1m 会把
  # >1MB 的上传全部 413 拒绝（开发环境走 Vite 代理无此限制，仅容器部署暴露）。留余量取 110m。
  client_max_body_size 110m;

  # server 只信任这一跳 Nginx；因此在 server 级统一规范化全部代理 location 的元数据。
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Forwarded-Port "";
  proxy_set_header X-Forwarded-Server "";

  # Let's Encrypt HTTP-01 验证目录；仅服务证书签发/续期的随机验证文件。
  # 实际内容由独立 Certbot 进程写入共享卷，不回退到 SPA 页面。
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
  }

  # 微信 OAuth 回调查询串由供应商协议承载。上游故障时 Nginx 固定格式的 error_log
  # 会附带完整请求行，因此该精确路径禁用普通错误日志；监控只使用无查询串的访问日志与状态码。
  location = /api/customers/wechat/callback {
    error_log /dev/null crit;
    proxy_pass http://server:3000/api/customers/wechat/callback;
    proxy_http_version 1.1;
  }

  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_http_version 1.1;
  }

  # 页面发布事件需要实时送达，关闭 Nginx 默认缓冲。
  location = /api/page-modules/document/stream {
    proxy_pass http://server:3000/api/page-modules/document/stream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # 商品公开资格变化同样通过 SSE 推送；必须关闭代理缓冲，避免事件滞留到连接关闭。
  location = /api/products/catalog/stream {
    proxy_pass http://server:3000/api/products/catalog/stream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://server:3000/uploads/;
    # 上传文件名由服务端 randomUUID 生成、内容变化即 URL 变化；历史迁移文件名未逐一核实，保守取 7 天。
    # 用 expires 而非 add_header Cache-Control，避免破坏上方 server 级安全响应头的继承。
    expires 7d;
  }

  # TLS 提示：本容器不持有证书，TLS 终端在外层代理并只回源到可信 8081。
  # 外层启用 https 时必须同步下发：
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # （HSTS 仅对 HTTPS 响应生效，在此处添加无意义；遗漏会在上线时失去降级防护。）

  # 开发模板台架不属于生产公开面；同时拦截 Windows 累积构建可能遗留的孤立旧 chunk。
  location = /__templates {
    return 404;
  }

  location ~* ^/assets/TemplateGallery-[^/]+\.js$ {
    return 404;
  }

  # 设计 QA 预览稿（*.preview.html）不进入生产公开面：源文件已移出 client/public，
  # 此规则拦截任何路径下的同名文件，作为构建产物回归时的纵深防御。
  location ~* \.preview\.html$ {
    return 404;
  }

  # 构建产物必须真实存在；缺失的脚本或样式不能回退到 SPA HTML，
  # 否则浏览器会收到错误的 200 与 text/html MIME 类型。
  location /assets/ {
    try_files $uri =404;
    # 构建产物文件名含内容哈希：内容变化即 URL 变化，可安全长缓存。
    # 用 expires 而非 add_header Cache-Control，避免破坏 server 级安全响应头的继承。
    expires 1y;
  }

  # EN-A：英文内容尚未形成独立发布事实时，响应头必须先于 React 水合阻止索引。
  # 正式开放英文站时必须由 EN-B 发布门禁显式移除此规则，不能只翻转前端常量。
  location ~* ^/en(/|$) {
    return 404;
  }

  location = /404.html {
    internal;
  }

  # 兼容已发出的 ?token= 旧链接时，同样不能让静态文件错误日志保留 bearer token。
  # 新邮件使用 fragment，正常情况下 token 不会到达 Nginx。
  location = /customer/reset {
    error_log /dev/null crit;
    try_files /index.html =404;
    expires -1;
  }

  # 后台、账户、交易和受控预览即使返回 SPA 壳，也不得被搜索引擎收录。
  location ~* ^/(admin|preview|customer|cart|checkout|partner)(/|$) {
    try_files /index.html =404;
    # SPA 壳不做本地缓存：新发布引用新哈希资源时，旧壳必须回源拿最新版本，否则会白屏。
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # 同上：index.html 与未哈希的 public 静态文件（robots/sitemap/favicon 等）保持回源校验。
    expires -1;
  }
}
