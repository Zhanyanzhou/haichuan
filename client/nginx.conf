map $request_uri $hc_robots_tag {
  default "";
  ~*^/en(/|$) "noindex, nofollow";
  ~*^/(admin|preview|customer|cart|checkout|partner)(/|$) "noindex, nofollow";
}

# 公网 HTTP 统一升级到 HTTPS；TLS 代理回源携带 https 标记，ACME 验证目录保持明文可达。
map "$http_x_forwarded_proto:$uri" $hc_redirect_https {
  default 1;
  ~^https: 0;
  ~^:/.well-known/acme-challenge/ 0;
}

server {
  listen 8080;
  server_name _;

  if ($hc_redirect_https) {
    return 308 https://$host$request_uri;
  }

  # 前端静态资源与 API 统一的基础安全响应头。
  # 受控图片由 SecureImage 以 Blob URL 渲染；仅放开 img-src 的 blob:，其余资源仍保持最小权限。
  # 字体外部源：fonts.googleapis.com（index.html 品牌字体样式表 + gstatic 二进制）；
  # rsms.me（Puck 编辑器样式的 @import "inter.css" 及其 woff2 同域——被 CSP 拦截时整个样式表会
  # 在浏览器 CSS 层标记失败，编辑器页面直接崩溃到兜底页，故必须放行）。
  # 注：两个字体域国内均常不可达，品牌字体本地化后应收紧回 'self'。
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://rsms.me; font-src 'self' data: https://fonts.gstatic.com https://rsms.me" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # 由 server 级 map 统一派生，避免 location 内 add_header 覆盖并丢失上述安全响应头。
  add_header X-Robots-Tag $hc_robots_tag always;

  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;

  # 上传体限制：图片 10MB / 视频 100MB（upload.controller 白名单上限），nginx 默认 1m 会把
  # >1MB 的上传全部 413 拒绝（开发环境走 Vite 代理无此限制，仅容器部署暴露）。留余量取 110m。
  client_max_body_size 110m;

  # Let's Encrypt HTTP-01 验证目录；仅服务证书签发/续期的随机验证文件。
  # 实际内容由独立 Certbot 进程写入共享卷，不回退到 SPA 页面。
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
    access_log off;
  }

  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 页面发布事件需要实时送达，关闭 Nginx 默认缓冲。
  location = /api/page-modules/document/stream {
    proxy_pass http://server:3000/api/page-modules/document/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  # 商品公开资格变化同样通过 SSE 推送；必须关闭代理缓冲，避免事件滞留到连接关闭。
  location = /api/products/catalog/stream {
    proxy_pass http://server:3000/api/products/catalog/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /uploads/ {
    proxy_pass http://server:3000/uploads/;
    proxy_set_header Host $host;
  }

  # 开发模板台架不属于生产公开面；同时拦截 Windows 累积构建可能遗留的孤立旧 chunk。
  location = /__templates {
    return 404;
  }

  location ~* ^/assets/TemplateGallery-[^/]+\.js$ {
    return 404;
  }

  # 构建产物必须真实存在；缺失的脚本或样式不能回退到 SPA HTML，
  # 否则浏览器会收到错误的 200 与 text/html MIME 类型。
  location /assets/ {
    try_files $uri =404;
  }

  # EN-A：英文内容尚未形成独立发布事实时，响应头必须先于 React 水合阻止索引。
  # 正式开放英文站时必须由 EN-B 发布门禁显式移除此规则，不能只翻转前端常量。
  location ~* ^/en(/|$) {
    return 404;
  }

  location = /404.html {
    internal;
  }

  # 后台、账户、交易和受控预览即使返回 SPA 壳，也不得被搜索引擎收录。
  location ~* ^/(admin|preview|customer|cart|checkout|partner)(/|$) {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
