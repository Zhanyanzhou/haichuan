<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>页面尚未发布 | 海川珠宝</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        color: #181a1b;
        background: #f4f5f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      article {
        width: min(100%, 680px);
        padding: clamp(40px, 8vw, 88px) clamp(24px, 7vw, 72px);
        border: 1px solid #dde1e2;
        background: #fff;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: #6e7477;
        font-size: 11px;
        letter-spacing: 0.14em;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        font-weight: 400;
        line-height: 1.25;
      }
      p {
        max-width: 440px;
        margin: 20px auto 0;
        color: #5f6568;
        font-size: 15px;
        line-height: 1.8;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 32px;
        padding: 0 24px;
        border: 1px solid #181a1b;
        color: #fff;
        background: #181a1b;
        font-size: 14px;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #5f6568; outline-offset: 4px; }
      @media (max-width: 480px) {
        article { text-align: left; }
        p { margin-inline: 0; }
        a { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <p class="eyebrow">HAICHUAN JEWELRY · 404</p>
        <h1>英文内容尚未发布</h1>
        <p>
          English content is not available yet. 您可以先浏览中文作品与顾问服务。
        </p>
        <a href="/">返回中文首页</a>
      </article>
    </main>
  </body>
</html>
