name: Verify Production Evidence

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: "生成受信生产证据 bundle 的 GitHub Actions run ID"
        required: true
        type: string
      evidence_artifact_name:
        description: "包含 production-evidence.json、attestation bundle 与全部引用文件的 artifact 名称"
        required: true
        type: string
      environment_id_sha256:
        description: "从批准记录独立取得的目标环境标识 SHA-256"
        required: true
        type: string
      approval_reference_sha256:
        description: "从批准记录独立取得的审批引用 SHA-256"
        required: true
        type: string
      release_git_sha:
        description: "冻结候选的 40 位 Git SHA"
        required: true
        type: string
      migration_bundle_sha256:
        description: "冻结候选的 migration bundle SHA-256"
        required: true
        type: string
      source_ref:
        description: "冻结候选的受保护 source ref"
        required: true
        type: string
      release_profile:
        description: "本次批准的发布档位"
        required: true
        default: lead-generation
        type: choice
        options:
          - lead-generation
          - commerce
      unprotected_ref_authorized:
        description: "当前 ref 未受保护时，已人工确认从该 ref 执行独立复验"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      authorization_sha256:
        description: "未保护 ref 的批准记录 SHA-256；必须与 approval_reference_sha256 一致"
        required: false
        default: ""
        type: string
      authorized_source_sha:
        description: "未保护 ref 必填：人工批准的精确 40 位 source SHA；必须等于本次 GITHUB_SHA"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: 校验验证来源与显式批准绑定
        shell: bash
        env:
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          UNPROTECTED_REF_AUTHORIZED: ${{ inputs.unprotected_ref_authorized }}
          AUTHORIZATION_SHA256: ${{ inputs.authorization_sha256 }}
          APPROVAL_REFERENCE_SHA256: ${{ inputs.approval_reference_sha256 }}
          AUTHORIZED_SOURCE_SHA: ${{ inputs.authorized_source_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in "$DEFAULT_BRANCH_REF"|refs/heads/release/*) ;; *) echo "RELEASE_REF_NOT_DEFAULT_OR_RELEASE_BRANCH" >&2; exit 1 ;; esac
          if [ "$RELEASE_REF_PROTECTED" = "true" ]; then
            authorization_mode="protected-ref"
          else
            test "$UNPROTECTED_REF_AUTHORIZED" = "true" || { echo "UNPROTECTED_EVIDENCE_VERIFY_REF_CONFIRMATION_REQUIRED" >&2; exit 1; }
            [[ "$AUTHORIZATION_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo "EVIDENCE_VERIFY_AUTHORIZATION_SHA256_INVALID" >&2; exit 1; }
            test "$AUTHORIZATION_SHA256" = "$APPROVAL_REFERENCE_SHA256" || { echo "EVIDENCE_VERIFY_AUTHORIZATION_APPROVAL_MISMATCH" >&2; exit 1; }
            [[ "$AUTHORIZED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "EVIDENCE_VERIFY_AUTHORIZED_SOURCE_SHA_INVALID" >&2; exit 1; }
            test "$AUTHORIZED_SOURCE_SHA" = "$GITHUB_SHA" || { echo "EVIDENCE_VERIFY_AUTHORIZED_SOURCE_SHA_MISMATCH" >&2; exit 1; }
            authorization_mode="explicit-unprotected-ref"
          fi
          {
            echo "### Production evidence verification authorization"
            echo "- mode: $authorization_mode"
            echo "- actor: $GITHUB_ACTOR"
            echo "- run: $GITHUB_RUN_ID"
            echo "- ref: $RELEASE_REF"
            echo "- source-sha: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检出验证器
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装固定版本 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: 登录 GHCR 以读取私有镜像签名
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装验证器依赖
        run: npm ci --ignore-scripts

      - name: 下载受信 evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: .codex-tmp/production-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}

      - name: 重验 production evidence 与完整签名链
        shell: bash
        env:
          ENVIRONMENT_ID_SHA256: ${{ inputs.environment_id_sha256 }}
          APPROVAL_REFERENCE_SHA256: ${{ inputs.approval_reference_sha256 }}
          RELEASE_GIT_SHA: ${{ inputs.release_git_sha }}
          MIGRATION_BUNDLE_SHA256: ${{ inputs.migration_bundle_sha256 }}
          RELEASE_SOURCE: https://github.com/${{ github.repository }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          SOURCE_REF: ${{ inputs.source_ref }}
          MANIFEST_SIGNER_WORKFLOW: github.com/${{ github.repository }}/.github/workflows/release-images.yml
          # 由仓库管理员预先绑定；调度者不能从 artifact 或本次输入中选择 signer。
          EVIDENCE_SIGNER_WORKFLOW: ${{ vars.PRODUCTION_EVIDENCE_SIGNER_WORKFLOW }}
        run: |
          set -euo pipefail
          if [ -z "$EVIDENCE_SIGNER_WORKFLOW" ]; then
            echo "PRODUCTION_EVIDENCE_SIGNER_WORKFLOW_NOT_CONFIGURED" >&2
            exit 1
          fi
          mkdir -p .codex-tmp/production-evidence-verification
          node scripts/verify-production-evidence.mjs \
            --evidence .codex-tmp/production-evidence/production-evidence.json \
            --evidence-root .codex-tmp/production-evidence \
            --evidence-bundle .codex-tmp/production-evidence/production-evidence.attestation.json \
            --environment-id-sha256 "$ENVIRONMENT_ID_SHA256" \
            --approval-reference-sha256 "$APPROVAL_REFERENCE_SHA256" \
            --release-git-sha "$RELEASE_GIT_SHA" \
            --migration-bundle-sha256 "$MIGRATION_BUNDLE_SHA256" \
            --release-source "$RELEASE_SOURCE" \
            --release-profile "$RELEASE_PROFILE" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --manifest-signer-workflow "$MANIFEST_SIGNER_WORKFLOW" \
            --evidence-signer-workflow "$EVIDENCE_SIGNER_WORKFLOW" \
            2>&1 | tee .codex-tmp/production-evidence-verification/result.json
          echo "PRODUCTION_EVIDENCE_VERIFIED"

      - name: 保存脱敏验证结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-evidence-verification-${{ github.run_id }}
          path: .codex-tmp/production-evidence-verification/result.json
          if-no-files-found: warn
          retention-days: 14
