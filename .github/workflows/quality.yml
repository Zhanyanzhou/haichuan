name: Quality Gate

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验部署与备份恢复脚本语法
        run: bash -n scripts/deploy-preproduction.sh server/scripts/backup.sh server/scripts/restore.sh server/scripts/check-backup-health.sh server/scripts/restore-drill.sh server/scripts/prune-backups.sh

      - name: 校验本地恢复演练入口语法
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run-operations-recovery-drill.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) > $null
          if ($errors.Count -gt 0) {
            throw ($errors | Out-String)
          }

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: 安装根目录依赖
        run: npm ci --ignore-scripts

      - name: 校验 migration 历史不可变与例外清单
        env:
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/verify-migration-integrity.mjs --git-range

      - name: 校验不可变镜像发布合同
        run: node scripts/verify-release-images.mjs --static

      - name: 校验环境变量合同
        run: node scripts/verify-environment-contract.mjs

      # 依赖安全审计（P1：OR 盘点 2026-08-15）。镜像 registry 不支持 audit 端点，须指定官方源。
      # --package-lock-only：仅审 lockfile，不要求 node_modules。
      # 级别 high：生产依赖的 high 及以上漏洞阻断 CI；具体版本以当前清单和 lockfile 为准。
      - name: 依赖安全审计（client）
        working-directory: client
        run: npm audit --omit=dev --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

      - name: 依赖安全审计（server）
        working-directory: server
        run: npm audit --omit=dev --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 安装服务端依赖
        working-directory: server
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: 校验 Prisma Schema
        working-directory: server
        env:
          # prisma validate（5.22+）会校验 env("DATABASE_URL") 是否存在；CI 无 .env，提供占位值仅供语法校验，不连接真实库
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci_db"
        run: npx prisma validate

      - name: 运行快速质量检查
        run: |
          npm run lint
          npm run typecheck
          npm run test:contracts
          npm run test:content-templates
          npm run test:template-v2-gate-d
          npm run test:decision-governance
          npm run test:client-public-env
          npm run test:server
          npm run test:release-supply-chain

      - name: 运行完整应用质量检查
        if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/release/')
        run: |
          npm run test:public-assets
          npm run test:runtime-ownership
          npm run test:admin-ui-standards
          npm run test:trade
          npm run test:selection-inquiry
          npm run test:ui-colors
          npm run build
          npm run verify:client-bundle
          npm run test:page-builder-publish

  # 公开、客户与后台三类确定性 UI E2E。各规格自行拦截其所需 API；需要真实服务的契约段按层级跳过。
  # 独立 runner 分区并发、分区内部保持单 worker，避免共享前端运行时与异步夹具互相污染。
  # 显式不可达的 API 地址保证 CI 不会静默借用外部或遗留后端。
  e2e-deterministic:
    name: Deterministic E2E - ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            project: public-chromium
            shard: 1/1
          - name: customer
            project: customer-chromium
            shard: 1/1
          - name: admin-1-of-2
            project: admin-chromium
            shard: 1/2
          - name: admin-2-of-2
            project: admin-chromium
            shard: 2/2
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: 安装 Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: 运行确定性 E2E 分区
        working-directory: client
        env:
          PLAYWRIGHT_APP_MODE: development
          VITE_API_BASE_URL: http://127.0.0.1:39999/api
        run: >-
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}
          --workers=1

      - name: 保存失败的 E2E 报告与 trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: warn
          retention-days: 10

  real-mysql:
    name: Real MySQL - migrations and persistence
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-root-only
          MYSQL_DATABASE: haichuan_ci_real_tests
          MYSQL_USER: isolated_ci
          MYSQL_PASSWORD: isolated-ci-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: 安装服务端依赖
        working-directory: server
        run: npm ci
      - name: 安装真实鉴权浏览器闭环依赖
        working-directory: client
        run: npm ci
      - name: 缓存真实鉴权浏览器
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - name: 安装真实鉴权 Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: 生成 Prisma Client
        working-directory: server
        run: npx prisma generate
      - name: 配置并验证隔离 MySQL trigger 策略
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_ROOT_PASSWORD: isolated-ci-root-only
          MYSQL_TEST_PASSWORD: isolated-ci-test-only
        run: |
          docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql -uroot --batch --skip-column-names \
            -e "SET GLOBAL log_bin_trust_function_creators = ON;"
          policy="$(docker exec -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --protocol=TCP --host=127.0.0.1 --user=isolated_ci --batch --skip-column-names \
            -e "SELECT @@GLOBAL.log_bin, @@GLOBAL.log_bin_trust_function_creators, (SELECT COUNT(*) FROM information_schema.USER_PRIVILEGES WHERE GRANTEE = CONCAT(QUOTE(SUBSTRING_INDEX(CURRENT_USER(), '@', 1)), '@', QUOTE(SUBSTRING_INDEX(CURRENT_USER(), '@', -1))) AND PRIVILEGE_TYPE = 'SUPER');" \
            haichuan_ci_real_tests)"
          test "$policy" = $'1\t1\t0'
          trigger_probe="$(docker exec -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --protocol=TCP --host=127.0.0.1 --user=isolated_ci --batch --skip-column-names \
            -e "CREATE TABLE __hc_trigger_probe (id INT PRIMARY KEY, touched INT NOT NULL DEFAULT 0); CREATE TRIGGER __hc_trigger_probe_before_insert BEFORE INSERT ON __hc_trigger_probe FOR EACH ROW SET NEW.touched = 1; INSERT INTO __hc_trigger_probe (id) VALUES (1); SELECT touched FROM __hc_trigger_probe WHERE id = 1; DROP TRIGGER __hc_trigger_probe_before_insert; DROP TABLE __hc_trigger_probe;" \
            haichuan_ci_real_tests)"
          test "$trigger_probe" = "1"
      - name: 验证一次性数据库入口保护
        run: node --test server/scripts/run-real-mysql-tests.spec.cjs
      - name: 空库完成全部不可变 migration 与已登记真实 MySQL 闭环（禁止跳过）
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
          MYSQL_TEST_PASSWORD: isolated-ci-test-only
          REAL_MYSQL_TEST_ISOLATED: "1"
          REAL_MYSQL_TEST_DATABASE_URL: mysql://isolated_ci:isolated-ci-test-only@127.0.0.1:${{ job.services.mysql.ports[3306] }}/haichuan_ci_real_tests
        run: |
          node server/scripts/run-real-mysql-tests.cjs
          expected_migrations="$(find server/prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql | wc -l | tr -d '[:space:]')"
          test "$expected_migrations" -gt 0
          applied_migrations="$(docker exec -e MYSQL_PWD="$MYSQL_TEST_PASSWORD" "$MYSQL_CONTAINER_ID" \
            mysql --protocol=TCP --host=127.0.0.1 --user=isolated_ci --batch --skip-column-names \
            -e "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL;" \
            haichuan_ci_real_tests)"
          test "$applied_migrations" = "$expected_migrations"

  full-proof:
    name: Full quality proof
    needs:
      - verify
      - e2e-deterministic
      - real-mysql
    if: always() && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 生成完整档机器证明
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: ${{ needs.e2e-deterministic.result }}
          MYSQL_RESULT: ${{ needs.real-mysql.result }}
        run: |
          set -euo pipefail
          mkdir -p quality-proof
          node - <<'NODE'
          const fs = require("node:fs");
          const results = {
            verify: process.env.VERIFY_RESULT,
            "e2e-deterministic": process.env.E2E_RESULT,
            "real-mysql": process.env.MYSQL_RESULT,
          };
          if (Object.values(results).some((result) => result !== "success")) {
            throw new Error(`QUALITY_FULL_JOB_SET_INCOMPLETE:${JSON.stringify(results)}`);
          }
          const proof = {
            schemaVersion: 1,
            profile: "full",
            workflow: "quality.yml",
            repository: process.env.GITHUB_REPOSITORY,
            gitSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            jobSet: ["verify", "e2e-deterministic", "real-mysql"],
            results,
          };
          fs.writeFileSync("quality-proof/quality-full-proof.json", `${JSON.stringify(proof, null, 2)}\n`);
          NODE

      - name: 上传完整档机器证明
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-full-proof-${{ github.sha }}-${{ github.run_id }}
          path: quality-proof/quality-full-proof.json
          if-no-files-found: error
          retention-days: 30
