name: Quality Gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: 安装根目录依赖
        run: npm ci

      # 依赖安全审计（P1：OR 盘点 2026-08-15）。镜像 registry 不支持 audit 端点，须指定官方源。
      # --package-lock-only：仅审 lockfile，不要求 node_modules。
      # 级别说明：nodemailer ≤9.0.0 的 high（SMTP 注入/SSRF）待升级后把级别收紧到 high。
      - name: 依赖安全审计（client）
        working-directory: client
        run: npm audit --omit=dev --package-lock-only --audit-level=critical --registry=https://registry.npmjs.org

      - name: 依赖安全审计（server）
        working-directory: server
        run: npm audit --omit=dev --package-lock-only --audit-level=critical --registry=https://registry.npmjs.org

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 安装服务端依赖
        working-directory: server
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: 校验 Prisma Schema
        working-directory: server
        env:
          # prisma validate（5.22+）会校验 env("DATABASE_URL") 是否存在；CI 无 .env，提供占位值仅供语法校验，不连接真实库
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci_db"
        run: npx prisma validate

      - name: 运行质量检查
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:trade
          npm run test:selection-inquiry
          npm run build
          npm run test:page-builder-publish

  # 公开页面 E2E（P1：OR 盘点 2026-08-15 补齐）。
  # mock 模式（不设 PLAYWRIGHT_API_BASE_URL）：真实接口契约段自动跳过，留部署后本地跑。
  # config 的 webServer 会在 CI 自动拉起 vite dev（127.0.0.1:5174）。
  e2e-public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: 安装 Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: 运行公开页面 E2E
        working-directory: client
        run: npx playwright test --project=public-chromium
