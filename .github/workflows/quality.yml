name: Quality Gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 校验备份恢复脚本语法
        run: bash -n server/scripts/backup.sh server/scripts/restore.sh

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: 校验 migration 历史不可变与例外清单
        env:
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_HEAD_SHA: ${{ github.sha }}
        run: node scripts/verify-migration-integrity.mjs --git-range

      - name: 校验不可变镜像发布合同
        run: node scripts/verify-release-images.mjs --static

      - name: 校验环境变量合同
        run: node scripts/verify-environment-contract.mjs

      - name: 安装根目录依赖
        run: npm ci

      # 依赖安全审计（P1：OR 盘点 2026-08-15）。镜像 registry 不支持 audit 端点，须指定官方源。
      # --package-lock-only：仅审 lockfile，不要求 node_modules。
      # 级别 high：nodemailer 已升 9.0.5（2026-08-15），生产依赖当前 0 漏洞，high 及以上挡 CI。
      - name: 依赖安全审计（client）
        working-directory: client
        run: npm audit --omit=dev --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

      - name: 依赖安全审计（server）
        working-directory: server
        run: npm audit --omit=dev --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 安装服务端依赖
        working-directory: server
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: 校验 Prisma Schema
        working-directory: server
        env:
          # prisma validate（5.22+）会校验 env("DATABASE_URL") 是否存在；CI 无 .env，提供占位值仅供语法校验，不连接真实库
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci_db"
        run: npx prisma validate

      - name: 运行质量检查
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run test:trade
          npm run test:selection-inquiry
          npm run test:ui-colors
          npm run build
          npm run verify:client-bundle
          npm run test:page-builder-publish

  # 公开、客户与后台三类确定性 UI E2E。各规格自行拦截其所需 API；需要真实服务的契约段按层级跳过。
  # 使用单 worker，避免共享前端运行时与异步夹具在并行压力下互相污染。
  # 显式不可达的 API 地址保证 CI 不会静默借用外部或遗留后端。
  e2e-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装客户端依赖
        working-directory: client
        run: npm ci

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: 安装 Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: 运行三类确定性 E2E
        working-directory: client
        env:
          PLAYWRIGHT_APP_MODE: development
          VITE_API_BASE_URL: http://127.0.0.1:39999/api
        run: >-
          npx playwright test
          --project=public-chromium
          --project=customer-chromium
          --project=admin-chromium
          --workers=1
