name: Release Images

on:
  workflow_dispatch:
    inputs:
      release_stage:
        description: "制品阶段；预发布与正式发布严格隔离"
        required: true
        default: "preproduction"
        type: choice
        options:
          - preproduction
          - production
      public_site_origin:
        description: "目标阶段站点 Origin（HTTPS，不含路径，必须与同阶段 SEO snapshot 一致）"
        required: true
        type: string
      public_seo_snapshot_artifact_id:
        description: "正式发布必填；预发布可留空并自动生成 contentReady=false 安全短页"
        required: false
        default: ""
        type: string
      api_base_url:
        description: "前端 API 基础路径"
        required: true
        default: "/api"
        type: string
      analytics_enabled:
        description: "是否把分析能力编入前端制品"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sigstore_public_log_acknowledged:
        description: "已确认本次签名会把证书、签名与制品/证明元数据写入公共 Sigstore 透明日志"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions: {}

jobs:
  quality-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.quality.outputs.run_id }}
      run_url: ${{ steps.quality.outputs.run_url }}
      head_sha: ${{ steps.quality.outputs.head_sha }}
    steps:
      - name: 拒绝未确认的 Sigstore 公共日志披露
        shell: bash
        env:
          SIGSTORE_PUBLIC_LOG_ACKNOWLEDGED: ${{ inputs.sigstore_public_log_acknowledged }}
        run: |
          test "$SIGSTORE_PUBLIC_LOG_ACKNOWLEDGED" = "true" || {
            echo "SIGSTORE_PUBLIC_LOG_ACKNOWLEDGEMENT_REQUIRED" >&2
            exit 1
          }

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: 拒绝未受保护的发布来源
        shell: bash
        env:
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$RELEASE_REF" = "$DEFAULT_BRANCH_REF" ]; then
            exit 0
          fi
          case "$RELEASE_REF" in
            refs/heads/release/*) ;;
            *) echo "RELEASE_REF_NOT_DEFAULT_OR_RELEASE_BRANCH" >&2; exit 1 ;;
          esac
          if [ "$RELEASE_REF_PROTECTED" != "true" ]; then
            echo "RELEASE_REF_NOT_PROTECTED" >&2
            exit 1
          fi

      - name: 查找同一 SHA 的成功质量门禁
        id: quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" \
            > "${RUNNER_TEMP}/quality-runs.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/quality-runs.json`, "utf8"));
          const runs = Array.isArray(payload) ? payload.flatMap((page) => page.workflow_runs ?? []) : payload.workflow_runs ?? [];
          const candidates = runs
            .filter((run) =>
              run.head_sha === process.env.GITHUB_SHA &&
              run.event === "push" &&
              run.status === "completed" &&
              run.conclusion === "success" &&
              run.head_repository?.full_name === process.env.GITHUB_REPOSITORY)
            .sort((left, right) => Number(right.id) - Number(left.id));
          const run = candidates[0];
          if (!run) throw new Error("QUALITY_GATE_SAME_SHA_SUCCESS_NOT_FOUND");
          const output = [
            `run_id=${run.id}`,
            `run_url=${run.html_url}`,
            `head_sha=${run.head_sha}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          NODE

  build-push:
    needs: quality-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      release_stage: ${{ steps.release.outputs.release_stage }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      migration_sha: ${{ steps.release.outputs.migration_sha }}
      server_image: ${{ steps.release.outputs.server_image }}
      server_digest: ${{ steps.server.outputs.digest }}
      client_image: ${{ steps.release.outputs.client_image }}
      client_digest: ${{ steps.client.outputs.digest }}
      operations_image: ${{ steps.release.outputs.operations_image }}
      operations_digest: ${{ steps.operations.outputs.digest }}
      signing_inputs_artifact_id: ${{ steps.signing-inputs-artifact.outputs.artifact-id }}
      signing_inputs_sha256: ${{ steps.signing-inputs.outputs.sha256 }}
      public_seo_snapshot_hash: ${{ steps.seo-source.outputs.snapshot_hash }}
      public_seo_prerender_manifest_sha256: ${{ steps.seo.outputs.prerender_manifest_sha }}
      public_seo_source_artifact_digest: ${{ steps.seo-source.outputs.source_artifact_digest }}
      public_seo_source_artifact_id: ${{ steps.seo-source.outputs.source_artifact_id }}
      public_seo_source_kind: ${{ steps.seo-source.outputs.source_kind }}
      public_seo_content_ready: ${{ steps.seo-source.outputs.content_ready }}
    steps:
      - name: 检出精确提交
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: 配置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: 安装发布验证依赖
        run: npm ci --ignore-scripts

      - name: 计算发布事实
        id: release
        shell: bash
        env:
          RELEASE_STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          case "$RELEASE_STAGE" in
            production)
              repository_stage_suffix=""
              image_tag="sha-${GITHUB_SHA}"
              ;;
            preproduction)
              repository_stage_suffix="-preproduction"
              image_tag="preproduction-sha-${GITHUB_SHA}"
              ;;
            *) echo "RELEASE_STAGE_INVALID" >&2; exit 1 ;;
          esac
          echo "migration_sha=$(node scripts/verify-migration-integrity.mjs --print-bundle-sha)" >> "$GITHUB_OUTPUT"
          echo "release_stage=${RELEASE_STAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "server_image=ghcr.io/${GITHUB_REPOSITORY,,}${repository_stage_suffix}-server" >> "$GITHUB_OUTPUT"
          echo "client_image=ghcr.io/${GITHUB_REPOSITORY,,}${repository_stage_suffix}-client" >> "$GITHUB_OUTPUT"
          echo "operations_image=ghcr.io/${GITHUB_REPOSITORY,,}${repository_stage_suffix}-operations" >> "$GITHUB_OUTPUT"

      - name: 获取审核快照或生成预发布安全快照
        id: seo-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEO_ARTIFACT_ID: ${{ inputs.public_seo_snapshot_artifact_id }}
          PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
          EXPECTED_SEO_PRODUCER_WORKFLOW_PATH: .github/workflows/export-public-seo-snapshot.yml
          RELEASE_STAGE: ${{ steps.release.outputs.release_stage }}
        run: |
          set -euo pipefail
          seo_input_dir="${RUNNER_TEMP}/public-seo-input"
          mkdir -p "$seo_input_dir" client/.release-seo
          if [ -z "$SEO_ARTIFACT_ID" ]; then
            test "$RELEASE_STAGE" = "preproduction" || {
              echo "PUBLIC_SEO_ARTIFACT_ID_REQUIRED_FOR_PRODUCTION" >&2
              exit 1
            }
            node scripts/create-preproduction-safe-seo-snapshot.mjs \
              --origin "$PUBLIC_SITE_ORIGIN" \
              --revision "$GITHUB_SHA" \
              --output client/.release-seo/public-seo-snapshot.json
            snapshot_digest="sha256:$(sha256sum client/.release-seo/public-seo-snapshot.json | cut -d ' ' -f 1)"
            {
              echo "source_artifact_id=0"
              echo "source_artifact_digest=${snapshot_digest}"
              echo "source_kind=safe-fallback"
              echo "content_ready=false"
            } >> "$GITHUB_OUTPUT"
          else
          [[ "$SEO_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "PUBLIC_SEO_ARTIFACT_ID_INVALID" >&2; exit 1; }
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEO_ARTIFACT_ID}" > "$seo_input_dir/metadata.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SEO_ARTIFACT_ID}/zip" > "$seo_input_dir/artifact.zip"
          producer_run_id="$(node -e 'const m=require(process.argv[1]); const expectedName=`public-seo-${process.env.RELEASE_STAGE}-snapshot-${process.env.GITHUB_SHA}`; if(m.name!==expectedName || m.expired || !Number.isInteger(m.workflow_run?.id) || m.workflow_run?.head_sha!==process.env.GITHUB_SHA || !/^sha256:[a-f0-9]{64}$/.test(m.digest||"")) process.exit(1); process.stdout.write(String(m.workflow_run.id))' "$seo_input_dir/metadata.json")" \
            || { echo "PUBLIC_SEO_ARTIFACT_METADATA_INVALID" >&2; exit 1; }
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${producer_run_id}" > "$seo_input_dir/producer-run.json"
          PRODUCER_RUN_PATH="$seo_input_dir/producer-run.json" node -e 'const r=require(process.env.PRODUCER_RUN_PATH); const workflowPath=String(r.path||"").split("@",1)[0]; if(r.head_sha!==process.env.GITHUB_SHA || r.repository?.full_name!==process.env.GITHUB_REPOSITORY || (r.head_repository && r.head_repository.full_name!==process.env.GITHUB_REPOSITORY) || workflowPath!==process.env.EXPECTED_SEO_PRODUCER_WORKFLOW_PATH || r.event!=="workflow_dispatch" || r.status!=="completed" || r.conclusion!=="success") process.exit(1)' \
            || { echo "PUBLIC_SEO_PRODUCER_RUN_INVALID" >&2; exit 1; }
          expected_digest="$(node -e 'process.stdout.write(require(process.argv[1]).digest)' "$seo_input_dir/metadata.json")"
          actual_digest="sha256:$(sha256sum "$seo_input_dir/artifact.zip" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$expected_digest" || { echo "PUBLIC_SEO_ARTIFACT_DIGEST_MISMATCH" >&2; exit 1; }
          mapfile -t entries < <(unzip -Z1 "$seo_input_dir/artifact.zip")
          test "${#entries[@]}" -eq 1 && test "${entries[0]}" = "public-seo-snapshot.json" \
            || { echo "PUBLIC_SEO_ARTIFACT_CONTENT_INVALID" >&2; exit 1; }
          unzip -q "$seo_input_dir/artifact.zip" -d "$seo_input_dir/extracted"
          cp "$seo_input_dir/extracted/public-seo-snapshot.json" client/.release-seo/public-seo-snapshot.json
          fi
          SEO_METADATA_PATH="$seo_input_dir/metadata.json" \
          SEO_SNAPSHOT_PATH="client/.release-seo/public-seo-snapshot.json" \
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validatePublicSeoSnapshot } from "./scripts/export-public-seo-snapshot.mjs";
          const snapshot = validatePublicSeoSnapshot(JSON.parse(readFileSync(process.env.SEO_SNAPSHOT_PATH, "utf8")));
          if (snapshot.sourceStage !== process.env.RELEASE_STAGE) throw new Error("PUBLIC_SEO_SOURCE_STAGE_MISMATCH");
          if (snapshot.origin !== process.env.PUBLIC_SITE_ORIGIN) throw new Error("PUBLIC_SEO_ORIGIN_MISMATCH");
          if (snapshot.sourceStage === "production" && snapshot.contentReady !== true) throw new Error("PUBLIC_SEO_PRODUCTION_CONTENT_NOT_READY");
          const lines = [`snapshot_hash=${snapshot.snapshotHash}`];
          if (process.env.SEO_ARTIFACT_ID) {
            const metadata = JSON.parse(readFileSync(process.env.SEO_METADATA_PATH, "utf8"));
            lines.push(
              `source_artifact_id=${process.env.SEO_ARTIFACT_ID}`,
              `source_artifact_digest=${metadata.digest}`,
              "source_kind=approved-snapshot",
              `content_ready=${snapshot.contentReady}`,
            );
          }
          process.stdout.write(`validated immutable SEO snapshot ${snapshot.snapshotHash}\n`);
          const fs = await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
          NODE

      - name: 构建并冻结客户端 SEO 发布制品
        id: seo
        shell: bash
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
          VITE_PUBLIC_SITE_ORIGIN: ${{ inputs.public_site_origin }}
          VITE_ANALYTICS_ENABLED: ${{ inputs.analytics_enabled }}
        run: |
          set -euo pipefail
          npm ci --prefix client
          npm run build --prefix client
          grep -F '<meta name="robots" content="noindex, nofollow" />' client/dist/index.html >/dev/null \
            || { echo "PUBLIC_SPA_FALLBACK_NOINDEX_MISSING" >&2; exit 1; }
          if [ "${{ steps.seo-source.outputs.content_ready }}" = "false" ]; then
            node scripts/create-preproduction-safe-seo-snapshot.mjs \
              --origin "$VITE_PUBLIC_SITE_ORIGIN" \
              --revision "$GITHUB_SHA" \
              --output "${RUNNER_TEMP}/safe-seo-recheck.json" \
              --html-output client/dist/preproduction-not-ready.html
            cmp "${RUNNER_TEMP}/safe-seo-recheck.json" client/.release-seo/public-seo-snapshot.json
          fi
          node scripts/prerender-public-routes.mjs \
            --snapshot client/.release-seo/public-seo-snapshot.json \
            --base-html client/dist/index.html \
            --out-dir client/dist
          node scripts/generate-public-seo-artifacts.mjs \
            --strict \
            --origin "$VITE_PUBLIC_SITE_ORIGIN" \
            --manifest client/.release-seo/public-seo-snapshot.json \
            --prerender-manifest client/dist/prerendered-routes.json \
            --out-dir client/dist \
            --nginx-map client/.release-seo/public-seo-routes.conf \
            --nginx-policy client/.release-seo/public-seo-policy.conf
          mkdir -p client/.release-seo/tools
          cp scripts/export-public-seo-snapshot.mjs \
             scripts/generate-public-seo-artifacts.mjs \
             scripts/prerender-public-routes.mjs \
             client/.release-seo/tools/
          echo "prerender_manifest_sha=$(sha256sum client/dist/prerendered-routes.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送服务端镜像
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: server
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.server_image }}:${{ steps.release.outputs.image_tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MIGRATION_BUNDLE_SHA256=${{ steps.release.outputs.migration_sha }}

      - name: 构建并推送客户端镜像
        id: client
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: client
          file: client/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.client_image }}:${{ steps.release.outputs.image_tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MIGRATION_BUNDLE_SHA256=${{ steps.release.outputs.migration_sha }}
            VITE_API_BASE_URL=${{ inputs.api_base_url }}
            VITE_PUBLIC_SITE_ORIGIN=${{ inputs.public_site_origin }}
            VITE_ANALYTICS_ENABLED=${{ inputs.analytics_enabled }}
            PUBLIC_SEO_SNAPSHOT_HASH=${{ steps.seo-source.outputs.snapshot_hash }}
            PUBLIC_SEO_PRERENDER_MANIFEST_SHA256=${{ steps.seo.outputs.prerender_manifest_sha }}
            PUBLIC_SEO_SNAPSHOT_ARTIFACT_DIGEST=${{ steps.seo-source.outputs.source_artifact_digest }}
            PUBLIC_SEO_CONTENT_READY=${{ steps.seo-source.outputs.content_ready }}
            PUBLIC_SEO_SOURCE_KIND=${{ steps.seo-source.outputs.source_kind }}

      - name: 以一次性 Nginx 核对客户端原始 HTTP 与 SEO 制品
        shell: bash
        env:
          CLIENT_REFERENCE: ${{ steps.release.outputs.client_image }}@${{ steps.client.outputs.digest }}
          PUBLIC_SEO_SNAPSHOT_HASH: ${{ steps.seo-source.outputs.snapshot_hash }}
          PUBLIC_SEO_PRERENDER_MANIFEST_SHA256: ${{ steps.seo.outputs.prerender_manifest_sha }}
          PUBLIC_SEO_SNAPSHOT_ARTIFACT_DIGEST: ${{ steps.seo-source.outputs.source_artifact_digest }}
          PUBLIC_SEO_CONTENT_READY: ${{ steps.seo-source.outputs.content_ready }}
          PUBLIC_SEO_SOURCE_KIND: ${{ steps.seo-source.outputs.source_kind }}
        run: |
          set -euo pipefail
          docker pull "$CLIENT_REFERENCE"
          client_container="$(docker run -d --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --add-host server:127.0.0.1 \
            -p 127.0.0.1::8081 \
            "$CLIENT_REFERENCE")"
          cleanup_client() { docker rm -f "$client_container" >/dev/null 2>&1 || true; }
          trap cleanup_client EXIT
          client_port="$(docker port "$client_container" 8081/tcp | awk -F: 'NR==1 { print $NF }')"
          test -n "$client_port" || { echo "CLIENT_HTTP_PORT_MISSING" >&2; exit 1; }
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:${client_port}/"; then
              break
            fi
            test "$attempt" -lt 30 || { docker logs "$client_container"; exit 1; }
            sleep 1
          done
          node scripts/verify-public-seo-http.mjs \
            --base-url "http://127.0.0.1:${client_port}" \
            --snapshot client/.release-seo/public-seo-snapshot.json
          test "$(docker image inspect "$CLIENT_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.public-seo-snapshot-sha256"}}{{end}}')" = "$PUBLIC_SEO_SNAPSHOT_HASH"
          test "$(docker image inspect "$CLIENT_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.public-seo-prerender-manifest-sha256"}}{{end}}')" = "$PUBLIC_SEO_PRERENDER_MANIFEST_SHA256"
          test "$(docker image inspect "$CLIENT_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.public-seo-source-artifact-digest"}}{{end}}')" = "$PUBLIC_SEO_SNAPSHOT_ARTIFACT_DIGEST"
          test "$(docker image inspect "$CLIENT_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.public-seo-content-ready"}}{{end}}')" = "$PUBLIC_SEO_CONTENT_READY"
          test "$(docker image inspect "$CLIENT_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.public-seo-source-kind"}}{{end}}')" = "$PUBLIC_SEO_SOURCE_KIND"

      - name: 构建并推送运维与备份镜像
        id: operations
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: server
          file: server/Dockerfile
          target: operations
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.operations_image }}:${{ steps.release.outputs.image_tag }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            MIGRATION_BUNDLE_SHA256=${{ steps.release.outputs.migration_sha }}

      - name: 核对三镜像不可变身份标签
        shell: bash
        env:
          SERVER_REFERENCE: ${{ steps.release.outputs.server_image }}@${{ steps.server.outputs.digest }}
          CLIENT_REFERENCE: ${{ steps.release.outputs.client_image }}@${{ steps.client.outputs.digest }}
          OPERATIONS_REFERENCE: ${{ steps.release.outputs.operations_image }}@${{ steps.operations.outputs.digest }}
          MIGRATION_SHA: ${{ steps.release.outputs.migration_sha }}
        run: |
          set -euo pipefail
          verify_identity() {
            reference="$1"
            component="$2"
            docker pull "$reference"
            test "$(docker image inspect "$reference" --format '{{with .Config.Labels}}{{index . "org.opencontainers.image.revision"}}{{end}}')" = "$GITHUB_SHA"
            test "$(docker image inspect "$reference" --format '{{with .Config.Labels}}{{index . "io.haichuan.component"}}{{end}}')" = "$component"
            test "$(docker image inspect "$reference" --format '{{with .Config.Labels}}{{index . "io.haichuan.migration-bundle-sha256"}}{{end}}')" = "$MIGRATION_SHA"
          }
          verify_identity "$SERVER_REFERENCE" server
          verify_identity "$CLIENT_REFERENCE" client
          verify_identity "$OPERATIONS_REFERENCE" operations

      - name: 离线核对服务端镜像原生依赖
        shell: bash
        env:
          SERVER_REFERENCE: ${{ steps.release.outputs.server_image }}@${{ steps.server.outputs.digest }}
        run: |
          docker pull "$SERVER_REFERENCE"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --entrypoint node \
            "$SERVER_REFERENCE" \
            -e '
              const fs = require("node:fs");
              const fail = (code, error) => {
                console.error(code, error ?? "");
                process.exit(1);
              };
              if (typeof process.getuid !== "function" || process.getuid() === 0) {
                fail("SERVER_RUNTIME_USER_INVALID");
              }
              if (fs.existsSync("node_modules/.bin/prisma")) {
                fail("SERVER_RUNTIME_PRISMA_CLI_PRESENT");
              }
              try {
                require("@nestjs/common");
              } catch (error) {
                fail("SERVER_RUNTIME_DEPENDENCY_INVALID:@nestjs/common", error);
              }
              let prisma;
              try {
                prisma = require("@prisma/client").Prisma;
              } catch (error) {
                fail("SERVER_RUNTIME_PRISMA_CLIENT_INVALID", error);
              }
              if (!prisma?.prismaVersion?.client) {
                fail("SERVER_RUNTIME_PRISMA_CLIENT_INVALID");
              }
              let sharp;
              try {
                sharp = require("sharp");
              } catch (error) {
                fail("SERVER_RUNTIME_NATIVE_DEPENDENCY_INVALID:sharp", error);
              }
              sharp({
                create: {
                  width: 2,
                  height: 2,
                  channels: 4,
                  background: { r: 212, g: 175, b: 55, alpha: 1 },
                },
              })
                .png()
                .toBuffer({ resolveWithObject: true })
                .then(({ data, info }) => {
                  if (data.length === 0 || info.format !== "png" || info.width !== 2 || info.height !== 2) {
                    fail("SERVER_RUNTIME_NATIVE_DEPENDENCY_INVALID:sharp");
                  }
                  console.log(JSON.stringify({
                    uid: process.getuid(),
                    sharp: sharp.versions.sharp,
                    vips: sharp.versions.vips,
                    png: { format: info.format, width: info.width, height: info.height, size: data.length },
                    prismaClient: prisma.prismaVersion.client,
                    prismaCliPresent: false,
                  }));
                })
                .catch((error) => fail("SERVER_RUNTIME_NATIVE_DEPENDENCY_INVALID:sharp", error));
            '

      - name: 离线核对运维镜像恢复入口
        shell: bash
        env:
          OPERATIONS_REFERENCE: ${{ steps.release.outputs.operations_image }}@${{ steps.operations.outputs.digest }}
          MIGRATION_SHA: ${{ steps.release.outputs.migration_sha }}
        run: |
          fail() {
            echo "::error::$1" >&2
            exit 1
          }
          docker pull "$OPERATIONS_REFERENCE"
          docker run --rm --network none --entrypoint /bin/bash "$OPERATIONS_REFERENCE" -lc '
            set -eu
            fail() {
              echo "$1" >&2
              exit 1
            }
            for executable in \
              /usr/local/bin/backup.sh \
              /usr/local/bin/check-backup-health.sh \
              /usr/local/bin/restore.sh \
              /usr/local/bin/restore-drill.sh \
              /usr/local/bin/prune-backups.sh
            do
              test -f "$executable" || fail "OPERATIONS_RUNTIME_EXECUTABLE_INVALID:$executable:file"
              test -x "$executable" || fail "OPERATIONS_RUNTIME_EXECUTABLE_INVALID:$executable:executable"
              test "$(stat -c "%U:%G:%a" "$executable")" = "root:root:555" || fail "OPERATIONS_RUNTIME_EXECUTABLE_INVALID:$executable:permissions"
              bash -n "$executable" || fail "OPERATIONS_RUNTIME_EXECUTABLE_INVALID:$executable:syntax"
            done
            command -v mariadb >/dev/null || fail "OPERATIONS_RUNTIME_TOOL_MISSING:mariadb"
            command -v mysqladmin >/dev/null || fail "OPERATIONS_RUNTIME_TOOL_MISSING:mysqladmin"
            node -e "for (const dependency of [\"@nestjs/common\", \"@prisma/client\", \"bcrypt\"]) require(dependency)"
            ./node_modules/.bin/prisma --version >/dev/null || fail "OPERATIONS_RUNTIME_TOOL_MISSING:prisma"
          '
          test "$(docker image inspect "$OPERATIONS_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.component"}}{{end}}')" = "operations" || fail "OPERATIONS_RUNTIME_LABEL_INVALID:component"
          test "$(docker image inspect "$OPERATIONS_REFERENCE" --format '{{with .Config.Labels}}{{index . "io.haichuan.migration-bundle-sha256"}}{{end}}')" = "$MIGRATION_SHA" || fail "OPERATIONS_RUNTIME_LABEL_INVALID:migration"
          test "$(docker image inspect "$OPERATIONS_REFERENCE" --format '{{with .Config.Labels}}{{index . "org.opencontainers.image.revision"}}{{end}}')" = "$GITHUB_SHA" || fail "OPERATIONS_RUNTIME_LABEL_INVALID:revision"

      - name: 从 registry 提取并校验三镜像 BuildKit provenance 与 SPDX 2.3 SBOM
        shell: bash
        env:
          SERVER_REFERENCE: ${{ steps.release.outputs.server_image }}@${{ steps.server.outputs.digest }}
          CLIENT_REFERENCE: ${{ steps.release.outputs.client_image }}@${{ steps.client.outputs.digest }}
          OPERATIONS_REFERENCE: ${{ steps.release.outputs.operations_image }}@${{ steps.operations.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p release-output/provenance release-output/sbom release-output/attestations
          for component in server client operations; do
            reference_variable="${component^^}_REFERENCE"
            reference="${!reference_variable}"
            docker buildx imagetools inspect "$reference" --format '{{ json .Provenance }}' > "release-output/provenance/${component}.raw.json"
            docker buildx imagetools inspect "$reference" --format '{{ json .SBOM }}' > "release-output/sbom/${component}.raw.json"
          done
          node - <<'NODE'
          const fs = require("node:fs");
          for (const component of ["server", "client", "operations"]) {
            const provenanceRawPath = `release-output/provenance/${component}.raw.json`;
            const sbomRawPath = `release-output/sbom/${component}.raw.json`;
            const provenanceRaw = JSON.parse(fs.readFileSync(provenanceRawPath, "utf8"));
            const sbomRaw = JSON.parse(fs.readFileSync(sbomRawPath, "utf8"));
            const buildkitProvenance = provenanceRaw?.SLSA ?? provenanceRaw?.["linux/amd64"]?.SLSA;
            const sbom = sbomRaw?.SPDX ?? sbomRaw?.["linux/amd64"]?.SPDX;
            if (!buildkitProvenance || typeof buildkitProvenance !== "object") {
              throw new Error(`RELEASE_BUILDKIT_PROVENANCE_INVALID:${component}`);
            }
            const provenanceJson = JSON.stringify(buildkitProvenance);
            const expectedSource = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            if (!provenanceJson.includes(process.env.GITHUB_SHA) || !provenanceJson.includes(expectedSource)) {
              throw new Error(`RELEASE_PROVENANCE_SOURCE_BINDING_INVALID:${component}`);
            }
            if (sbom?.spdxVersion !== "SPDX-2.3" || sbom?.SPDXID !== "SPDXRef-DOCUMENT") {
              throw new Error(`RELEASE_SBOM_INVALID:${component}`);
            }
            fs.writeFileSync(`release-output/provenance/${component}.buildkit.json`, `${provenanceJson}\n`);
            fs.writeFileSync(`release-output/sbom/${component}.spdx.json`, `${JSON.stringify(sbom)}\n`);
            fs.rmSync(provenanceRawPath);
            fs.rmSync(sbomRawPath);
          }
          NODE

      - name: 冻结签名任务的最小哈希约束输入
        id: signing-inputs
        shell: bash
        env:
          SERVER_IMAGE_NAME: ${{ steps.release.outputs.server_image }}
          SERVER_IMAGE_DIGEST: ${{ steps.server.outputs.digest }}
          CLIENT_IMAGE_NAME: ${{ steps.release.outputs.client_image }}
          CLIENT_IMAGE_DIGEST: ${{ steps.client.outputs.digest }}
          OPERATIONS_IMAGE_NAME: ${{ steps.release.outputs.operations_image }}
          OPERATIONS_IMAGE_DIGEST: ${{ steps.operations.outputs.digest }}
          MIGRATION_SHA: ${{ steps.release.outputs.migration_sha }}
          QUALITY_RUN_ID: ${{ needs.quality-proof.outputs.run_id }}
          QUALITY_RUN_URL: ${{ needs.quality-proof.outputs.run_url }}
          QUALITY_HEAD_SHA: ${{ needs.quality-proof.outputs.head_sha }}
          PUBLIC_SEO_SNAPSHOT_HASH: ${{ steps.seo-source.outputs.snapshot_hash }}
          PUBLIC_SEO_PRERENDER_MANIFEST_SHA256: ${{ steps.seo.outputs.prerender_manifest_sha }}
          PUBLIC_SEO_SOURCE_ARTIFACT_ID: ${{ steps.seo-source.outputs.source_artifact_id }}
          PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST: ${{ steps.seo-source.outputs.source_artifact_digest }}
          PUBLIC_SEO_SOURCE_KIND: ${{ steps.seo-source.outputs.source_kind }}
          PUBLIC_SEO_CONTENT_READY: ${{ steps.seo-source.outputs.content_ready }}
          RELEASE_STAGE: ${{ steps.release.outputs.release_stage }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const descriptor = (path) => ({ path, sha256: sha256(fs.readFileSync("release-output/" + path)) });
          const image = (component, name, digest) => ({
            image: name,
            digest,
            reference: name + "@" + digest,
            buildkitProvenance: descriptor("provenance/" + component + ".buildkit.json"),
            sbom: descriptor("sbom/" + component + ".spdx.json"),
          });
          const inputs = {
            schemaVersion: 3,
            releaseStage: process.env.RELEASE_STAGE,
            imageTag: process.env.IMAGE_TAG,
            gitSha: process.env.GITHUB_SHA,
            source: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY,
            sourceRef: process.env.GITHUB_REF,
            migrationBundleSha256: process.env.MIGRATION_SHA,
            qualityGate: { runId: Number(process.env.QUALITY_RUN_ID), runUrl: process.env.QUALITY_RUN_URL, headSha: process.env.QUALITY_HEAD_SHA },
            publicSeo: {
              sourceStage: process.env.RELEASE_STAGE,
              snapshotHash: process.env.PUBLIC_SEO_SNAPSHOT_HASH,
              prerenderManifestSha256: process.env.PUBLIC_SEO_PRERENDER_MANIFEST_SHA256,
              sourceArtifactId: Number(process.env.PUBLIC_SEO_SOURCE_ARTIFACT_ID),
              sourceArtifactDigest: process.env.PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST,
              sourceKind: process.env.PUBLIC_SEO_SOURCE_KIND,
              contentReady: process.env.PUBLIC_SEO_CONTENT_READY === "true",
            },
            images: {
              server: image("server", process.env.SERVER_IMAGE_NAME, process.env.SERVER_IMAGE_DIGEST),
              client: image("client", process.env.CLIENT_IMAGE_NAME, process.env.CLIENT_IMAGE_DIGEST),
              operations: image("operations", process.env.OPERATIONS_IMAGE_NAME, process.env.OPERATIONS_IMAGE_DIGEST),
            },
          };
          fs.writeFileSync("release-output/signing-inputs.json", JSON.stringify(inputs, null, 2) + "\n");
          NODE
          echo "sha256=$(sha256sum release-output/signing-inputs.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: 上传哈希约束签名输入
        id: signing-inputs-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ steps.release.outputs.release_stage }}-signing-inputs-${{ github.run_id }}
          path: |
            release-output/signing-inputs.json
            release-output/provenance/*.buildkit.json
            release-output/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 1

  sign-release:
    needs:
      - quality-proof
      - build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      packages: write
      id-token: write
    steps:
      - name: 配置固定 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: 安装固定版本 Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: 登录 GHCR 以写入签名 referrer
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 按本次运行的固定 artifact ID 下载签名输入
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build-push.outputs.signing_inputs_artifact_id }}
          path: release-input

      - name: 校验上游摘要并构造独立 SLSA v1 provenance
        shell: bash
        env:
          EXPECTED_SIGNING_INPUTS_SHA256: ${{ needs.build-push.outputs.signing_inputs_sha256 }}
          EXPECTED_MIGRATION_SHA: ${{ needs.build-push.outputs.migration_sha }}
          EXPECTED_QUALITY_RUN_ID: ${{ needs.quality-proof.outputs.run_id }}
          EXPECTED_QUALITY_RUN_URL: ${{ needs.quality-proof.outputs.run_url }}
          EXPECTED_QUALITY_HEAD_SHA: ${{ needs.quality-proof.outputs.head_sha }}
          EXPECTED_SERVER_IMAGE: ${{ needs.build-push.outputs.server_image }}
          EXPECTED_SERVER_DIGEST: ${{ needs.build-push.outputs.server_digest }}
          EXPECTED_CLIENT_IMAGE: ${{ needs.build-push.outputs.client_image }}
          EXPECTED_CLIENT_DIGEST: ${{ needs.build-push.outputs.client_digest }}
          EXPECTED_OPERATIONS_IMAGE: ${{ needs.build-push.outputs.operations_image }}
          EXPECTED_OPERATIONS_DIGEST: ${{ needs.build-push.outputs.operations_digest }}
          EXPECTED_PUBLIC_SEO_SNAPSHOT_HASH: ${{ needs.build-push.outputs.public_seo_snapshot_hash }}
          EXPECTED_PUBLIC_SEO_PRERENDER_MANIFEST_SHA256: ${{ needs.build-push.outputs.public_seo_prerender_manifest_sha256 }}
          EXPECTED_PUBLIC_SEO_SOURCE_ARTIFACT_ID: ${{ needs.build-push.outputs.public_seo_source_artifact_id }}
          EXPECTED_PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST: ${{ needs.build-push.outputs.public_seo_source_artifact_digest }}
          EXPECTED_PUBLIC_SEO_SOURCE_KIND: ${{ needs.build-push.outputs.public_seo_source_kind }}
          EXPECTED_PUBLIC_SEO_CONTENT_READY: ${{ needs.build-push.outputs.public_seo_content_ready }}
          EXPECTED_RELEASE_STAGE: ${{ needs.build-push.outputs.release_stage }}
          EXPECTED_IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-output/provenance release-output/sbom release-output/attestations release-output/verified
          actual_inputs_sha="$(sha256sum release-input/signing-inputs.json | cut -d ' ' -f 1)"
          test "$actual_inputs_sha" = "$EXPECTED_SIGNING_INPUTS_SHA256" || {
            echo "RELEASE_SIGNING_INPUTS_HASH_MISMATCH" >&2
            exit 1
          }
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const fail = (code) => { throw new Error(code); };
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const exact = (value, keys, code) => {
            if (!value || typeof value !== "object" || Array.isArray(value) ||
                JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...keys].sort())) fail(code);
          };
          const input = JSON.parse(fs.readFileSync("release-input/signing-inputs.json", "utf8"));
          exact(input, ["schemaVersion", "releaseStage", "imageTag", "gitSha", "source", "sourceRef", "migrationBundleSha256", "qualityGate", "publicSeo", "images"], "RELEASE_SIGNING_INPUTS_SCHEMA_INVALID");
          if (input.schemaVersion !== 3 || input.gitSha !== process.env.GITHUB_SHA ||
              input.source !== process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY ||
              input.sourceRef !== process.env.GITHUB_REF ||
              input.releaseStage !== process.env.EXPECTED_RELEASE_STAGE ||
              input.imageTag !== process.env.EXPECTED_IMAGE_TAG ||
              input.migrationBundleSha256 !== process.env.EXPECTED_MIGRATION_SHA) {
            fail("RELEASE_SIGNING_INPUTS_IDENTITY_MISMATCH");
          }
          exact(input.qualityGate, ["runId", "runUrl", "headSha"], "RELEASE_SIGNING_QUALITY_SCHEMA_INVALID");
          if (input.qualityGate.runId !== Number(process.env.EXPECTED_QUALITY_RUN_ID) ||
              input.qualityGate.runUrl !== process.env.EXPECTED_QUALITY_RUN_URL ||
              input.qualityGate.headSha !== process.env.EXPECTED_QUALITY_HEAD_SHA ||
              input.qualityGate.headSha !== process.env.GITHUB_SHA) fail("RELEASE_SIGNING_QUALITY_MISMATCH");
          exact(input.publicSeo, ["sourceStage", "snapshotHash", "prerenderManifestSha256", "sourceArtifactId", "sourceArtifactDigest", "sourceKind", "contentReady"], "RELEASE_SIGNING_SEO_SCHEMA_INVALID");
          if (input.publicSeo.sourceStage !== input.releaseStage ||
              input.publicSeo.snapshotHash !== process.env.EXPECTED_PUBLIC_SEO_SNAPSHOT_HASH ||
              input.publicSeo.prerenderManifestSha256 !== process.env.EXPECTED_PUBLIC_SEO_PRERENDER_MANIFEST_SHA256 ||
              input.publicSeo.sourceArtifactId !== Number(process.env.EXPECTED_PUBLIC_SEO_SOURCE_ARTIFACT_ID) ||
              input.publicSeo.sourceArtifactDigest !== process.env.EXPECTED_PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST ||
              input.publicSeo.sourceKind !== process.env.EXPECTED_PUBLIC_SEO_SOURCE_KIND ||
              input.publicSeo.contentReady !== (process.env.EXPECTED_PUBLIC_SEO_CONTENT_READY === "true") ||
              (input.releaseStage === "production" && (!input.publicSeo.contentReady || input.publicSeo.sourceKind !== "approved-snapshot")) ||
              (input.publicSeo.sourceKind === "safe-fallback" && (input.releaseStage !== "preproduction" || input.publicSeo.contentReady || input.publicSeo.sourceArtifactId !== 0))) {
            fail("RELEASE_SIGNING_SEO_MISMATCH");
          }
          exact(input.images, ["server", "client", "operations"], "RELEASE_SIGNING_IMAGES_SCHEMA_INVALID");
          const expectedImages = {
            server: [process.env.EXPECTED_SERVER_IMAGE, process.env.EXPECTED_SERVER_DIGEST],
            client: [process.env.EXPECTED_CLIENT_IMAGE, process.env.EXPECTED_CLIENT_DIGEST],
            operations: [process.env.EXPECTED_OPERATIONS_IMAGE, process.env.EXPECTED_OPERATIONS_DIGEST],
          };
          const source = input.source;
          const builderId = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/.github/workflows/release-images.yml@" + process.env.GITHUB_REF;
          const buildType = source + "/blob/" + process.env.GITHUB_SHA + "/.github/workflows/release-images.yml#cosign-image-release-v2";
          for (const component of ["server", "client", "operations"]) {
            const image = input.images[component];
            exact(image, ["image", "digest", "reference", "buildkitProvenance", "sbom"], "RELEASE_SIGNING_IMAGE_SCHEMA_INVALID:" + component);
            const [expectedName, expectedDigest] = expectedImages[component];
            if (image.image !== expectedName || image.digest !== expectedDigest ||
                image.reference !== expectedName + "@" + expectedDigest ||
                !/^sha256:[a-f0-9]{64}$/.test(image.digest)) fail("RELEASE_SIGNING_IMAGE_IDENTITY_MISMATCH:" + component);
            for (const [kind, expectedPath] of [
              ["buildkitProvenance", "provenance/" + component + ".buildkit.json"],
              ["sbom", "sbom/" + component + ".spdx.json"],
            ]) {
              const descriptor = image[kind];
              exact(descriptor, ["path", "sha256"], "RELEASE_SIGNING_DESCRIPTOR_SCHEMA_INVALID:" + component + ":" + kind);
              if (descriptor.path !== expectedPath || !/^[a-f0-9]{64}$/.test(descriptor.sha256)) {
                fail("RELEASE_SIGNING_DESCRIPTOR_INVALID:" + component + ":" + kind);
              }
              const bytes = fs.readFileSync(path.join("release-input", descriptor.path));
              if (sha256(bytes) !== descriptor.sha256) fail("RELEASE_SIGNING_DESCRIPTOR_HASH_MISMATCH:" + component + ":" + kind);
            }
            const buildkitPath = path.join("release-input", image.buildkitProvenance.path);
            const buildkitBytes = fs.readFileSync(buildkitPath);
            const buildkit = JSON.parse(buildkitBytes);
            const buildkitPredicateType = buildkit?.buildDefinition && buildkit?.runDetails
              ? "https://slsa.dev/provenance/v1"
              : buildkit?.buildType && buildkit?.builder
                ? "https://slsa.dev/provenance/v0.2"
                : null;
            if (!buildkitPredicateType) fail("RELEASE_BUILDKIT_PROVENANCE_TYPE_INVALID:" + component);
            const buildkitJson = JSON.stringify(buildkit);
            if (!buildkitJson.includes(process.env.GITHUB_SHA) || !buildkitJson.includes(source)) {
              fail("RELEASE_PROVENANCE_SOURCE_BINDING_INVALID:" + component);
            }
            const sbomPath = path.join("release-input", image.sbom.path);
            const sbom = JSON.parse(fs.readFileSync(sbomPath, "utf8"));
            if (sbom?.spdxVersion !== "SPDX-2.3" || sbom?.SPDXID !== "SPDXRef-DOCUMENT") {
              fail("RELEASE_SBOM_INVALID:" + component);
            }
            fs.copyFileSync(sbomPath, "release-output/sbom/" + component + ".spdx.json");
            const predicate = {
              buildDefinition: {
                buildType,
                externalParameters: {
                  component,
                  releaseStage: input.releaseStage,
                  imageTag: input.imageTag,
                  platform: "linux/amd64",
                  source,
                  sourceRef: process.env.GITHUB_REF,
                  gitSha: process.env.GITHUB_SHA,
                  buildkitProvenancePredicateType,
                  buildkitProvenanceSha256: image.buildkitProvenance.sha256,
                },
                internalParameters: {},
                resolvedDependencies: [{ uri: source, digest: { gitCommit: process.env.GITHUB_SHA } }],
              },
              runDetails: {
                builder: { id: builderId },
                metadata: { invocationId: source + "/actions/runs/" + process.env.GITHUB_RUN_ID },
              },
            };
            fs.writeFileSync("release-output/provenance/" + component + ".slsa-v1.json", JSON.stringify(predicate) + "\n");
          }
          NODE

      - name: 使用 GitHub OIDC 对三镜像、provenance 与 SBOM 执行 Cosign Keyless 签名
        shell: bash
        env:
          SERVER_REFERENCE: ${{ needs.build-push.outputs.server_image }}@${{ needs.build-push.outputs.server_digest }}
          CLIENT_REFERENCE: ${{ needs.build-push.outputs.client_image }}@${{ needs.build-push.outputs.client_digest }}
          OPERATIONS_REFERENCE: ${{ needs.build-push.outputs.operations_image }}@${{ needs.build-push.outputs.operations_digest }}
        run: |
          set -euo pipefail
          sign_image() {
            component="$1"
            reference="$2"
            cosign sign --yes \
              --bundle "release-output/attestations/${component}-image.sigstore.json" \
              "$reference"
            cosign attest --yes \
              --type slsaprovenance1 \
              --predicate "release-output/provenance/${component}.slsa-v1.json" \
              --bundle "release-output/attestations/${component}-provenance.sigstore.json" \
              "$reference"
            cosign attest --yes \
              --type spdxjson \
              --predicate "release-output/sbom/${component}.spdx.json" \
              --bundle "release-output/attestations/${component}-sbom.sigstore.json" \
              "$reference"
          }
          sign_image server "$SERVER_REFERENCE"
          sign_image client "$CLIENT_REFERENCE"
          sign_image operations "$OPERATIONS_REFERENCE"

      - name: 按九个标准 bundle sidecar 验证身份、subject 和 predicate
        shell: bash
        env:
          SERVER_REFERENCE: ${{ needs.build-push.outputs.server_image }}@${{ needs.build-push.outputs.server_digest }}
          CLIENT_REFERENCE: ${{ needs.build-push.outputs.client_image }}@${{ needs.build-push.outputs.client_digest }}
          OPERATIONS_REFERENCE: ${{ needs.build-push.outputs.operations_image }}@${{ needs.build-push.outputs.operations_digest }}
          EXPECTED_RELEASE_STAGE: ${{ needs.build-push.outputs.release_stage }}
          EXPECTED_IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          signer_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          verification_identity=(
            --certificate-identity "$signer_identity"
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            --certificate-github-workflow-trigger "workflow_dispatch"
            --certificate-github-workflow-sha "$GITHUB_SHA"
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-ref "$GITHUB_REF"
          )
          verify_image() {
            component="$1"
            reference="$2"
            cosign verify "${verification_identity[@]}" \
              --bundle "release-output/attestations/${component}-image.sigstore.json" \
              "$reference" > "release-output/verified/${component}-image.json"
            cosign verify-attestation "${verification_identity[@]}" \
              --bundle "release-output/attestations/${component}-provenance.sigstore.json" \
              --type slsaprovenance1 "$reference" > "release-output/verified/${component}-provenance.dsse.jsonl"
            cosign verify-attestation "${verification_identity[@]}" \
              --bundle "release-output/attestations/${component}-sbom.sigstore.json" \
              --type spdxjson "$reference" > "release-output/verified/${component}-sbom.dsse.jsonl"
          }
          verify_image server "$SERVER_REFERENCE"
          verify_image client "$CLIENT_REFERENCE"
          verify_image operations "$OPERATIONS_REFERENCE"
          node - <<'NODE'
          const fs = require("node:fs");
          const expectedMediaType = "application/vnd.dev.sigstore.bundle.v0.3+json";
          const references = {
            server: process.env.SERVER_REFERENCE,
            client: process.env.CLIENT_REFERENCE,
            operations: process.env.OPERATIONS_REFERENCE,
          };
          const expectedSource = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY;
          const expectedBuilder = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/.github/workflows/release-images.yml@" + process.env.GITHUB_REF;
          const parseDocuments = (pathname) => {
            const text = fs.readFileSync(pathname, "utf8").trim();
            if (!text) throw new Error("RELEASE_COSIGN_OUTPUT_EMPTY:" + pathname);
            try {
              const parsed = JSON.parse(text);
              return Array.isArray(parsed) ? parsed : [parsed];
            } catch {
              return text.split(/\r?\n/).filter(Boolean).flatMap((line) => {
                const parsed = JSON.parse(line);
                return Array.isArray(parsed) ? parsed : [parsed];
              });
            }
          };
          const statements = (pathname) => parseDocuments(pathname).map((envelope) =>
            JSON.parse(Buffer.from(envelope.payload, "base64").toString("utf8")));
          for (const component of ["server", "client", "operations"]) {
            for (const kind of ["image", "provenance", "sbom"]) {
              const pathname = "release-output/attestations/" + component + "-" + kind + ".sigstore.json";
              const bundle = JSON.parse(fs.readFileSync(pathname, "utf8"));
              if (bundle?.mediaType !== expectedMediaType) throw new Error("RELEASE_SIGSTORE_BUNDLE_FORMAT_INVALID:" + component + ":" + kind);
            }
            const expectedDigest = references[component].split("@sha256:")[1];
            const signature = parseDocuments("release-output/verified/" + component + "-image.json").find((entry) => {
              const critical = entry?.critical ?? entry?.Critical;
              const image = critical?.image ?? critical?.Image;
              return (image?.["docker-manifest-digest"] ?? image?.["Docker-manifest-digest"]) === "sha256:" + expectedDigest;
            });
            if (!signature) throw new Error("RELEASE_SIGNED_IMAGE_SUBJECT_INVALID:" + component);
            const provenance = statements("release-output/verified/" + component + "-provenance.dsse.jsonl").find((statement) =>
              statement?.predicateType === "https://slsa.dev/provenance/v1" &&
              statement.subject?.some((subject) => subject?.digest?.sha256 === expectedDigest));
            const parameters = provenance?.predicate?.buildDefinition?.externalParameters;
            if (parameters?.component !== component || parameters?.source !== expectedSource ||
                parameters?.releaseStage !== process.env.EXPECTED_RELEASE_STAGE ||
                parameters?.imageTag !== process.env.EXPECTED_IMAGE_TAG ||
                parameters?.sourceRef !== process.env.GITHUB_REF || parameters?.gitSha !== process.env.GITHUB_SHA ||
                provenance?.predicate?.runDetails?.builder?.id !== expectedBuilder) {
              throw new Error("RELEASE_SIGNED_PROVENANCE_CONTENT_INVALID:" + component);
            }
            const sbom = statements("release-output/verified/" + component + "-sbom.dsse.jsonl").find((statement) =>
              statement?.predicateType === "https://spdx.dev/Document" &&
              statement.subject?.some((subject) => subject?.digest?.sha256 === expectedDigest));
            if (sbom?.predicate?.spdxVersion !== "SPDX-2.3" || sbom?.predicate?.SPDXID !== "SPDXRef-DOCUMENT") {
              throw new Error("RELEASE_SIGNED_SBOM_CONTENT_INVALID:" + component);
            }
          }
          NODE

      - name: 生成 schema v5 不可变发布清单和真实 SLSA v1 predicate
        shell: bash
        env:
          SERVER_IMAGE_NAME: ${{ needs.build-push.outputs.server_image }}
          SERVER_IMAGE_DIGEST: ${{ needs.build-push.outputs.server_digest }}
          CLIENT_IMAGE_NAME: ${{ needs.build-push.outputs.client_image }}
          CLIENT_IMAGE_DIGEST: ${{ needs.build-push.outputs.client_digest }}
          OPERATIONS_IMAGE_NAME: ${{ needs.build-push.outputs.operations_image }}
          OPERATIONS_IMAGE_DIGEST: ${{ needs.build-push.outputs.operations_digest }}
          MIGRATION_SHA: ${{ needs.build-push.outputs.migration_sha }}
          QUALITY_RUN_ID: ${{ needs.quality-proof.outputs.run_id }}
          QUALITY_RUN_URL: ${{ needs.quality-proof.outputs.run_url }}
          QUALITY_HEAD_SHA: ${{ needs.quality-proof.outputs.head_sha }}
          PUBLIC_SEO_SNAPSHOT_HASH: ${{ needs.build-push.outputs.public_seo_snapshot_hash }}
          PUBLIC_SEO_PRERENDER_MANIFEST_SHA256: ${{ needs.build-push.outputs.public_seo_prerender_manifest_sha256 }}
          PUBLIC_SEO_SOURCE_ARTIFACT_ID: ${{ needs.build-push.outputs.public_seo_source_artifact_id }}
          PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST: ${{ needs.build-push.outputs.public_seo_source_artifact_digest }}
          PUBLIC_SEO_SOURCE_KIND: ${{ needs.build-push.outputs.public_seo_source_kind }}
          PUBLIC_SEO_CONTENT_READY: ${{ needs.build-push.outputs.public_seo_content_ready }}
          RELEASE_STAGE: ${{ needs.build-push.outputs.release_stage }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const workflow = "github.com/" + process.env.GITHUB_REPOSITORY + "/.github/workflows/release-images.yml";
          const signerIdentity = "https://" + workflow + "@" + process.env.GITHUB_REF;
          const descriptor = (path) => ({ path, sha256: sha256(fs.readFileSync("release-output/" + path)) });
          const image = (component, name, digest) => ({
            image: name,
            digest,
            reference: name + "@" + digest,
            signatureBundle: descriptor("attestations/" + component + "-image.sigstore.json"),
            provenanceBundle: descriptor("attestations/" + component + "-provenance.sigstore.json"),
            sbomBundle: descriptor("attestations/" + component + "-sbom.sigstore.json"),
            provenancePredicateType: "https://slsa.dev/provenance/v1",
            sbomPredicateType: "https://spdx.dev/Document",
          });
          const operations = {
            ...image("operations", process.env.OPERATIONS_IMAGE_NAME, process.env.OPERATIONS_IMAGE_DIGEST),
            runtimeExecutables: [
              "/usr/local/bin/backup.sh",
              "/usr/local/bin/check-backup-health.sh",
              "/usr/local/bin/restore.sh",
              "/usr/local/bin/restore-drill.sh",
              "/usr/local/bin/prune-backups.sh",
            ],
          };
          const manifest = {
            schemaVersion: 6,
            releaseStage: process.env.RELEASE_STAGE,
            imageTag: process.env.IMAGE_TAG,
            gitSha: process.env.GITHUB_SHA,
            migrationBundleSha256: process.env.MIGRATION_SHA,
            source: process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY,
            qualityGate: {
              workflow: "quality.yml",
              runId: Number(process.env.QUALITY_RUN_ID),
              runUrl: process.env.QUALITY_RUN_URL,
              headSha: process.env.QUALITY_HEAD_SHA,
              event: "push",
              conclusion: "success",
            },
            attestationPolicy: {
              signingSystem: "sigstore-cosign-keyless",
              cosignVersion: "v3.1.3",
              bundleMediaType: "application/vnd.dev.sigstore.bundle.v0.3+json",
              signerWorkflow: workflow,
              signerIdentity,
              certificateOidcIssuer: "https://token.actions.githubusercontent.com",
              sourceRef: process.env.GITHUB_REF,
              sourceDigest: process.env.GITHUB_SHA,
              imageSignaturesVerified: true,
              imageAttestationsVerified: true,
              provenancePredicateType: "https://slsa.dev/provenance/v1",
              sbomPredicateType: "https://spdx.dev/Document",
              manifestPredicateType: "https://slsa.dev/provenance/v1",
            },
            publicSeo: {
              sourceStage: process.env.RELEASE_STAGE,
              snapshotHash: process.env.PUBLIC_SEO_SNAPSHOT_HASH,
              prerenderManifestSha256: process.env.PUBLIC_SEO_PRERENDER_MANIFEST_SHA256,
              sourceArtifactId: Number(process.env.PUBLIC_SEO_SOURCE_ARTIFACT_ID),
              sourceArtifactDigest: process.env.PUBLIC_SEO_SOURCE_ARTIFACT_DIGEST,
              sourceKind: process.env.PUBLIC_SEO_SOURCE_KIND,
              contentReady: process.env.PUBLIC_SEO_CONTENT_READY === "true",
            },
            server: image("server", process.env.SERVER_IMAGE_NAME, process.env.SERVER_IMAGE_DIGEST),
            client: image("client", process.env.CLIENT_IMAGE_NAME, process.env.CLIENT_IMAGE_DIGEST),
            operations,
          };
          const stageSuffix = process.env.RELEASE_STAGE === "production" ? "" : "-preproduction";
          const expectedImageNames = {
            server: "ghcr.io/" + process.env.GITHUB_REPOSITORY.toLowerCase() + stageSuffix + "-server",
            client: "ghcr.io/" + process.env.GITHUB_REPOSITORY.toLowerCase() + stageSuffix + "-client",
            operations: "ghcr.io/" + process.env.GITHUB_REPOSITORY.toLowerCase() + stageSuffix + "-operations",
          };
          for (const component of ["server", "client", "operations"]) {
            if (manifest[component].image !== expectedImageNames[component] ||
                manifest[component].reference !== manifest[component].image + "@" + manifest[component].digest) {
              throw new Error("RELEASE_MANIFEST_IMAGE_INVALID:" + component);
            }
          }
          fs.writeFileSync("release-output/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          const imageDependency = (reference) => {
            const [uri, digest] = reference.split("@sha256:");
            return { uri, digest: { sha256: digest } };
          };
          const source = manifest.source;
          const predicate = {
            buildDefinition: {
              buildType: source + "/blob/" + process.env.GITHUB_SHA + "/.github/workflows/release-images.yml#release-manifest-v6",
              externalParameters: {
                gitSha: process.env.GITHUB_SHA,
                sourceRef: process.env.GITHUB_REF,
                qualityGateRunId: Number(process.env.QUALITY_RUN_ID),
                schemaVersion: 6,
                releaseStage: process.env.RELEASE_STAGE,
                imageTag: process.env.IMAGE_TAG,
              },
              internalParameters: {},
              resolvedDependencies: [
                { uri: source, digest: { gitCommit: process.env.GITHUB_SHA } },
                imageDependency(manifest.server.reference),
                imageDependency(manifest.client.reference),
                imageDependency(manifest.operations.reference),
              ],
            },
            runDetails: {
              builder: { id: signerIdentity },
              metadata: { invocationId: source + "/actions/runs/" + process.env.GITHUB_RUN_ID },
            },
          };
          fs.writeFileSync("release-output/release-manifest.provenance.json", JSON.stringify(predicate) + "\n");
          NODE

      - name: 签署并解析验证发布清单 SLSA v1 provenance bundle
        shell: bash
        env:
          SERVER_REFERENCE: ${{ needs.build-push.outputs.server_image }}@${{ needs.build-push.outputs.server_digest }}
          CLIENT_REFERENCE: ${{ needs.build-push.outputs.client_image }}@${{ needs.build-push.outputs.client_digest }}
          OPERATIONS_REFERENCE: ${{ needs.build-push.outputs.operations_image }}@${{ needs.build-push.outputs.operations_digest }}
          QUALITY_RUN_ID: ${{ needs.quality-proof.outputs.run_id }}
          RELEASE_STAGE: ${{ needs.build-push.outputs.release_stage }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          signer_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${GITHUB_REF}"
          cosign attest-blob --yes \
            --type slsaprovenance1 \
            --predicate release-output/release-manifest.provenance.json \
            --bundle release-output/release-manifest.attestation.json \
            release-output/release-manifest.json >/dev/null
          cosign verify-blob-attestation \
            --type slsaprovenance1 \
            --bundle release-output/release-manifest.attestation.json \
            --certificate-identity "$signer_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            release-output/release-manifest.json > release-output/verified/release-manifest.dsse.jsonl
          node - <<'NODE'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const bundle = JSON.parse(fs.readFileSync("release-output/release-manifest.attestation.json", "utf8"));
          if (bundle?.mediaType !== "application/vnd.dev.sigstore.bundle.v0.3+json") throw new Error("RELEASE_MANIFEST_SIGSTORE_BUNDLE_FORMAT_INVALID");
          const manifestBytes = fs.readFileSync("release-output/release-manifest.json");
          const expectedManifestDigest = createHash("sha256").update(manifestBytes).digest("hex");
          const statements = fs.readFileSync("release-output/verified/release-manifest.dsse.jsonl", "utf8")
            .split(/\r?\n/).filter(Boolean).map((line) => {
              const envelope = JSON.parse(line);
              return JSON.parse(Buffer.from(envelope.payload, "base64").toString("utf8"));
            });
          const statement = statements.find((candidate) =>
            candidate?.predicateType === "https://slsa.dev/provenance/v1" &&
            candidate.subject?.some((subject) => subject?.digest?.sha256 === expectedManifestDigest));
          const predicate = statement?.predicate;
          const parameters = predicate?.buildDefinition?.externalParameters;
          const source = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY;
          const expectedBuilder = "https://github.com/" + process.env.GITHUB_REPOSITORY + "/.github/workflows/release-images.yml@" + process.env.GITHUB_REF;
          const expectedBuildType = source + "/blob/" + process.env.GITHUB_SHA + "/.github/workflows/release-images.yml#release-manifest-v6";
          if (predicate?.buildDefinition?.buildType !== expectedBuildType ||
              parameters?.gitSha !== process.env.GITHUB_SHA ||
              parameters?.sourceRef !== process.env.GITHUB_REF ||
              parameters?.qualityGateRunId !== Number(process.env.QUALITY_RUN_ID) ||
              parameters?.schemaVersion !== 6 ||
              parameters?.releaseStage !== process.env.RELEASE_STAGE ||
              parameters?.imageTag !== process.env.IMAGE_TAG ||
              predicate?.runDetails?.builder?.id !== expectedBuilder) {
            throw new Error("RELEASE_MANIFEST_PROVENANCE_CONTENT_INVALID");
          }
          const expectedDependencies = new Set([
            source + "@git:" + process.env.GITHUB_SHA,
            process.env.SERVER_REFERENCE.split("@sha256:")[0] + "@sha256:" + process.env.SERVER_REFERENCE.split("@sha256:")[1],
            process.env.CLIENT_REFERENCE.split("@sha256:")[0] + "@sha256:" + process.env.CLIENT_REFERENCE.split("@sha256:")[1],
            process.env.OPERATIONS_REFERENCE.split("@sha256:")[0] + "@sha256:" + process.env.OPERATIONS_REFERENCE.split("@sha256:")[1],
          ]);
          const resolvedDependencies = predicate?.buildDefinition?.resolvedDependencies ?? [];
          const actualDependencies = new Set(resolvedDependencies.map((dependency) =>
            dependency.digest?.gitCommit
              ? dependency.uri + "@git:" + dependency.digest.gitCommit
              : dependency.uri + "@sha256:" + dependency.digest?.sha256));
          if (resolvedDependencies.length !== expectedDependencies.size ||
              actualDependencies.size !== expectedDependencies.size ||
              [...expectedDependencies].some((dependency) => !actualDependencies.has(dependency))) {
            throw new Error("RELEASE_MANIFEST_PROVENANCE_DEPENDENCIES_INVALID");
          }
          NODE

      - name: 上传发布清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ needs.build-push.outputs.release_stage }}-manifest-${{ github.sha }}
          path: |
            release-output/release-manifest.json
            release-output/release-manifest.attestation.json
            release-output/attestations/*.sigstore.json
          if-no-files-found: error
          retention-days: 90
