# 本地开发覆盖文件（docker compose 自动加载）
# 目的：将 MySQL 端口映射到宿主机回环地址，供宿主机 `npm run dev` 的后端连接。
# 仅绑定 127.0.0.1，不暴露到局域网/公网，主 docker-compose.yml 的生产安全设计不变。
#
# 端口所有权（2026-08-19 决策，详见 docs/DECISIONS.md A.12）：
#   - 3000 永远归宿主机后端（vite 5173 的 /api 代理目标，开发唯一 API 归属）
#   - 容器 server 映射 3002，仅供验收时直连对比；完整容器栈经 :80 自包含访问
#   - 背景：容器/宿主机后端曾互抢 3000，导致 API 归属静默切换、上传媒体存储分裂（2026-08-19 事故）
services:
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
  server:
    ports:
      - "127.0.0.1:3002:3000"
