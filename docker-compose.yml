# 全容器统一日志上限：防止 stdout 日志无限增长吃满磁盘（OR-1）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== 数据库 =====
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: jewelry-mysql
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cpus: "${MYSQL_CPUS:-2.0}"
    mem_limit: "${MYSQL_MEMORY_LIMIT:-2g}"
    pids_limit: ${MYSQL_PIDS_LIMIT:-512}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: jewelry_db
      MYSQL_USER: jewelry_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # P0-3：生产不对宿主机暴露 3306（管理走 prisma studio / docker exec / SSH 隧道）
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jewelry-network

  # ===== 缓存 =====
  # Redis 已移除（OR 批决策）：queue 模块删除后服务端零消费方，常驻容器属死基础设施。
  # 未来启用缓存/共享限流时再加回（镜像+healthcheck 模板见 git 历史）。

  # ===== 后端 NestJS 服务 =====
  server:
    # 正式 Compose 只消费 Release Images 产出的 digest 引用，禁止源码构建和浮动 tag。
    image: "${SERVER_IMAGE_NAME:?SERVER_IMAGE_NAME is required}@sha256:${SERVER_IMAGE_DIGEST:?SERVER_IMAGE_DIGEST is required}"
    container_name: jewelry-server
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cpus: "${SERVER_CPUS:-1.5}"
    mem_limit: "${SERVER_MEMORY_LIMIT:-1g}"
    pids_limit: ${SERVER_PIDS_LIMIT:-256}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # 线上交易总开关（默认关闭；获 D.2 批准后才显式设为 true）
      CUSTOMER_COMMERCE_ENABLED: "${CUSTOMER_COMMERCE_ENABLED:-false}"
      # 客户报价确认转单独立开关；不等于在线支付开放。
      CUSTOMER_QUOTATION_ORDERING_ENABLED: "${CUSTOMER_QUOTATION_ORDERING_ENABLED:-false}"
      PARTNER_APPLICATIONS_WRITE_ENABLED: "${PARTNER_APPLICATIONS_WRITE_ENABLED:-false}"
      # 动态模板只读预检始终可用；原子激活必须在目标环境单独显式开启。
      RELEASE_PROFILE: "${RELEASE_PROFILE:-lead-generation}"
      # 可选能力一律显式注入；缺失时由服务端按各自合同关闭或诚实降级。
      WECHAT_APP_ID: "${WECHAT_APP_ID:-}"
      WECHAT_APP_SECRET: "${WECHAT_APP_SECRET:-}"
      WECHAT_REDIRECT_URI: "${WECHAT_REDIRECT_URI:-}"
      ANALYTICS_INGESTION_ENABLED: "${ANALYTICS_INGESTION_ENABLED:-false}"
      ANALYTICS_DATASET: "${ANALYTICS_DATASET:-test}"
      ANALYTICS_RETENTION_DAYS: "${ANALYTICS_RETENTION_DAYS:-90}"
      ANALYTICS_RETENTION_ENABLED: "${ANALYTICS_RETENTION_ENABLED:-false}"
      ANALYTICS_TRUSTED_GEO_HEADERS: "${ANALYTICS_TRUSTED_GEO_HEADERS:-false}"
      ANALYTICS_DASHBOARD_ENABLED: "${ANALYTICS_DASHBOARD_ENABLED:-true}"
      GOLD_PRICE_API_URL: "${GOLD_PRICE_API_URL:-}"
      KIMI_API_KEY: "${KIMI_API_KEY:-}"
      KIMI_BASE_URL: "${KIMI_BASE_URL:-}"
      KIMI_MODEL: "${KIMI_MODEL:-moonshot-v1-8k}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SITE_BASE_URL: "${SITE_BASE_URL:-}"
      # 通知事实始终随业务事务写入；这里只控制事务外真实邮件消费者，默认关闭。
      NOTIFICATION_DELIVERY_ENABLED: "${NOTIFICATION_DELIVERY_ENABLED:-false}"
      PAYMENT_GATEWAY_TRANSACTIONS_ENABLED: "${PAYMENT_GATEWAY_TRANSACTIONS_ENABLED:-false}"
      PAYMENT_GATEWAY_REFUNDS_ENABLED: "${PAYMENT_GATEWAY_REFUNDS_ENABLED:-false}"
      ALIPAY_APP_ID: "${ALIPAY_APP_ID:-}"
      ALIPAY_PRIVATE_KEY: "${ALIPAY_PRIVATE_KEY:-}"
      ALIPAY_PUBLIC_KEY: "${ALIPAY_PUBLIC_KEY:-}"
      ALIPAY_GATEWAY: "${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}"
      WECHAT_PAY_APP_ID: "${WECHAT_PAY_APP_ID:-}"
      WECHAT_MCH_ID: "${WECHAT_MCH_ID:-}"
      WECHAT_MCH_CERT_SERIAL_NO: "${WECHAT_MCH_CERT_SERIAL_NO:-}"
      WECHAT_PLATFORM_CERT_PATH: "${WECHAT_PLATFORM_CERT_PATH:-}"
      WECHAT_MCH_PRIVATE_KEY_PATH: "${WECHAT_MCH_PRIVATE_KEY_PATH:-}"
      WECHAT_API_V3_KEY: "${WECHAT_API_V3_KEY:-}"
      KUAIDI100_CUSTOMER: "${KUAIDI100_CUSTOMER:-}"
      KUAIDI100_KEY: "${KUAIDI100_KEY:-}"
      ALIYUN_SMS_ACCESS_KEY_ID: "${ALIYUN_SMS_ACCESS_KEY_ID:-}"
      ALIYUN_SMS_ACCESS_KEY_SECRET: "${ALIYUN_SMS_ACCESS_KEY_SECRET:-}"
      ALIYUN_SMS_SIGN_NAME: "${ALIYUN_SMS_SIGN_NAME:-}"
      ALIYUN_SMS_TEMPLATE_CODE: "${ALIYUN_SMS_TEMPLATE_CODE:-}"
      SMS_VERIFICATION_REQUIRED: "${SMS_VERIFICATION_REQUIRED:-false}"
      # D.29 页面素材公开读取与私有归档分别复用现有持久化卷；URL 仍保持 /uploads/page-assets/*。
      PUBLIC_MEDIA_ROOT: /app/uploads
      PAGE_MEDIA_ARCHIVE_ROOT: /app/private-media/page-assets-archive
      # 付款凭证保持私有并复用 private_media_data，禁止落入可公开读取的 /app/uploads。
      PAYMENT_PROOF_MEDIA_ROOT: /app/private-media/payment-proofs
      PRODUCT_MEDIA_ROOT: /app/private-media/products
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS is required}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:?BACKUP_RETENTION_DAYS is required}"
      # 后台状态与 backup healthcheck 使用同一 RPO 边界，不额外放宽。
      BACKUP_HEALTH_GRACE_SECONDS: "0"
    # P0-3：不对宿主机暴露 3000（仅 nginx 反代 /api 与 /uploads → server:3000，见 nginx.conf）
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
      # 页面素材归档、受控商品媒体和付款凭证必须跨容器重建持久化，禁止写回镜像层。
      - private_media_data:/app/private-media
      # 备份产物只读挂载：settings.getBackupStatus 据此向后台展示真实备份状态（OR-1 衔接）。
      - type: bind
        source: "${BACKUP_HOST_DIR:?BACKUP_HOST_DIR must be an absolute host path}"
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jewelry-network

  # ===== 前端 Nginx 服务 =====
  client:
    image: "${CLIENT_IMAGE_NAME:?CLIENT_IMAGE_NAME is required}@sha256:${CLIENT_IMAGE_DIGEST:?CLIENT_IMAGE_DIGEST is required}"
    container_name: jewelry-client
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cpus: "${CLIENT_CPUS:-1.0}"
    mem_limit: "${CLIENT_MEMORY_LIMIT:-384m}"
    pids_limit: ${CLIENT_PIDS_LIMIT:-128}
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 公网只开放 HTTP 跳转/ACME；来访者转发头不能绕过 308。
      - "80:8080"
      # TLS 边缘代理的可信回源口仅绑定宿主回环；同网络边缘容器可使用 client:8081。
      - "127.0.0.1:8081:8081"
    volumes:
      # 仅读共享 ACME HTTP-01 验证文件；证书私钥不进入客户端容器。
      - acme_challenge_data:/var/www/certbot:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - jewelry-network

  # ===== 定时备份（OR-1：数据库 + 媒体卷，含付款凭证）=====
  # 复用已签名 operations digest；备份脚本与数据库客户端均固化在镜像内，禁止从 checkout bind 可执行代码。
  # 启动即执行一轮备份（部署即可验证），此后每 BACKUP_INTERVAL_SECONDS 一轮；保留目标由 BACKUP_RETENTION_DAYS 显式给定。
  # 产出在 BACKUP_HOST_DIR 指向的宿主机绝对路径；异地加密/不可变副本需由目标环境另行接线并验收。
  backup:
    image: "${OPERATIONS_IMAGE_NAME:?OPERATIONS_IMAGE_NAME is required}@sha256:${OPERATIONS_IMAGE_DIGEST:?OPERATIONS_IMAGE_DIGEST is required}"
    container_name: jewelry-backup
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cpus: "${BACKUP_CPUS:-1.0}"
    mem_limit: "${BACKUP_MEMORY_LIMIT:-768m}"
    pids_limit: ${BACKUP_PIDS_LIMIT:-128}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: jewelry_user
      DB_PASS: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: jewelry_db
      BACKUP_DIR: /backups
      MEDIA_DIRS: /media/uploads:/media/private-media
      DISK_WARN_PCT: ${DISK_WARN_PCT:-85}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?BACKUP_RETENTION_DAYS is required}
      BACKUP_DB_READY_TIMEOUT_SECONDS: ${BACKUP_DB_READY_TIMEOUT_SECONDS:?BACKUP_DB_READY_TIMEOUT_SECONDS is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS is required}
      BACKUP_RPO_SECONDS: ${BACKUP_RPO_SECONDS:?BACKUP_RPO_SECONDS is required}
      BACKUP_CONSISTENCY_MODE: ${BACKUP_CONSISTENCY_MODE:-best-effort}
      BACKUP_WRITE_QUIESCE_EVIDENCE_SHA256: ${BACKUP_WRITE_QUIESCE_EVIDENCE_SHA256:-NONE}
    volumes:
      - uploads_data:/media/uploads:ro
      - private_media_data:/media/private-media:ro
      - type: bind
        source: "${BACKUP_HOST_DIR:?BACKUP_HOST_DIR must be an absolute host path}"
        target: /backups
        bind:
          create_host_path: false
    entrypoint:
      - /bin/bash
      - -c
      - |
        while true; do
          attempt_started=$$(date +%s)
          /bin/bash /usr/local/bin/backup.sh || echo "🚨 ERROR: 备份执行失败，将在下个周期重试"
          elapsed=$$(($$(date +%s) - attempt_started))
          remaining=$$((BACKUP_INTERVAL_SECONDS - elapsed))
          [ "$$remaining" -gt 0 ] || remaining=1
          sleep "$$remaining"
        done
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash /usr/local/bin/check-backup-health.sh"]
      interval: 15m
      timeout: 10m
      retries: 3
      start_period: 90s
    networks:
      - jewelry-network

  # ===== 存活监控告警（OR-1：uptime-kuma 自托管，零外部账号依赖）=====
  # 面板仅绑定 127.0.0.1:3001（浏览器访问 http://127.0.0.1:3001，远程经 SSH 隧道）。
  # 首次部署后在 UI 中手动添加监控项：
  #   http://server:3000/api/health  （后端进程存活，不检查数据库）
  #   http://server:3000/api/ready   （后端与数据库就绪）
  #   http://client:8081/            （受控网络内的可信前台回源）
  # 通知渠道在 UI 配置（邮件/企业微信/webhook 均可）。
  # 备份容器健康、磁盘水位与真实通知接收必须在目标环境单独接线并演练；未接线时为发布阻断，日志巡检不构成 PASS。
  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: jewelry-uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cpus: "${MONITOR_CPUS:-0.5}"
    mem_limit: "${MONITOR_MEMORY_LIMIT:-512m}"
    pids_limit: ${MONITOR_PIDS_LIMIT:-256}
    volumes:
      - kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - jewelry-network

volumes:
  mysql_data:
    external: true
    name: "${MYSQL_VOLUME_NAME:?MYSQL_VOLUME_NAME is required}"
  uploads_data:
    external: true
    name: "${UPLOADS_VOLUME_NAME:?UPLOADS_VOLUME_NAME is required}"
  private_media_data:
    external: true
    name: "${PRIVATE_MEDIA_VOLUME_NAME:?PRIVATE_MEDIA_VOLUME_NAME is required}"
  kuma_data:
  acme_challenge_data:

networks:
  jewelry-network:
    driver: bridge
