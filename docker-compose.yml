# 全容器统一日志上限：防止 stdout 日志无限增长吃满磁盘（OR-1）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ===== 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: jewelry-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: jewelry_db
      MYSQL_USER: jewelry_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # P0-3：生产不对宿主机暴露 3306（管理走 prisma studio / docker exec / SSH 隧道）
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jewelry-network

  # ===== 缓存 =====
  # Redis 已移除（OR 批决策）：queue 模块删除后服务端零消费方，常驻容器属死基础设施。
  # 未来启用缓存/共享限流时再加回（镜像+healthcheck 模板见 git 历史）。

  # ===== 后端 NestJS 服务 =====
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jewelry-server
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
    # P0-3：不对宿主机暴露 3000（仅 nginx 反代 /api 与 /uploads → server:3000，见 nginx.conf）
    expose:
      - "3000"
    volumes:
      - uploads_data:/app/uploads
      # 受控商品媒体和付款凭证必须跨容器重建持久化，禁止写回镜像层。
      - private_media_data:/app/private-media
      # 备份产物只读挂载：settings.getBackupStatus 据此向后台展示真实备份状态（OR-1 衔接）。
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jewelry-network

  # ===== 前端 Nginx 服务 =====
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: jewelry-client
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - jewelry-network

  # ===== 定时备份（OR-1：数据库 + 媒体卷，含付款凭证）=====
  # 复用 mysql:8.0 镜像（自带 mysqldump/tar/bash），脚本挂载自仓库，改脚本无需重建镜像。
  # 启动即执行一轮备份（部署即可验证），此后每 BACKUP_INTERVAL_SECONDS 一轮，保留 7 天。
  # 产出在宿主机 ./backups（建议纳入宿主机异地同步，如 rsync/对象存储）。
  backup:
    image: mysql:8.0
    container_name: jewelry-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: jewelry_user
      DB_PASS: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      DB_NAME: jewelry_db
      BACKUP_DIR: /backups
      MEDIA_DIRS: /media/uploads:/media/private-media
      DISK_WARN_PCT: ${DISK_WARN_PCT:-85}
      RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./server/scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - uploads_data:/media/uploads:ro
      - private_media_data:/media/private-media:ro
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - |
        while true; do
          /bin/bash /usr/local/bin/backup.sh || echo "🚨 ERROR: 备份执行失败，将在下个周期重试"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks:
      - jewelry-network

  # ===== 存活监控告警（OR-1：uptime-kuma 自托管，零外部账号依赖）=====
  # 面板仅绑定 127.0.0.1:3001（浏览器访问 http://127.0.0.1:3001，远程经 SSH 隧道）。
  # 首次部署后在 UI 中手动添加监控项：
  #   http://server:3000/api/health  （后端+数据库就绪）
  #   http://client:80/              （前台可达）
  # 通知渠道在 UI 配置（邮件/企业微信/webhook 均可）。
  # 备份容器与磁盘水位无 HTTP 端点，由 backup.sh 输出告警日志（docker logs jewelry-backup 巡检）。
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: jewelry-uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - jewelry-network

volumes:
  mysql_data:
  uploads_data:
  private_media_data:
  kuma_data:

networks:
  jewelry-network:
    driver: bridge
